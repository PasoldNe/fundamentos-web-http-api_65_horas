<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="author" content="@karizeviecelli"><meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados."><title>Exposição — Aula 14 Tratamento de Erros</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}.hdr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#0f172a;border-bottom:1px solid #1e293b;z-index:10}.hdr h1{font-size:13px;font-weight:600;color:#94a3b8}.chkbadge{font-size:10px;font-weight:700;background:#78350f;color:#fbbf24;padding:2px 9px;border-radius:20px;margin-left:8px}.dots{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#334155;cursor:pointer;transition:background .2s}.dot.active{background:#3b82f6}.slide-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 40px}.slide{display:none;max-width:880px;width:100%}.slide.active{display:block;animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;font-weight:600;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.slide h2{font-size:28px;font-weight:700;margin-bottom:18px;color:#f1f5f9}.slide p{font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px}.card h3{font-size:14px;color:#93c5fd;margin-bottom:6px}.card p{font-size:13px;color:#94a3b8;margin:0}.code-wrap{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;margin-top:14px;overflow-x:auto;white-space:pre}.k{color:#93C5FD}.a{color:#FDE68A}.s{color:#FDA4AF}.t{color:#E2E8F0}.c{color:#64748b;font-style:italic}.fn{color:#5EEAD4}.hl{background:#1e3a5f;border-left:3px solid #3b82f6;padding:10px 16px;border-radius:6px;font-size:13px;color:#bfdbfe;margin-top:14px}.tag-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tag{background:#1e293b;border:1px solid #334155;color:#93c5fd;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s}.tag:hover{background:#334155}.tag-desc{margin-top:10px;font-size:13px;color:#94a3b8;min-height:18px}.quiz-block{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;margin-top:14px}.quiz-block p{color:#e2e8f0;font-weight:600;margin-bottom:10px}.qopt{display:block;width:100%;text-align:left;background:#0f172a;border:1px solid #334155;color:#cbd5e1;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;font-family:inherit}.qopt:hover{background:#1e293b}.qopt.correct{background:#052e1a;border-color:#16a34a;color:#4ade80}.qopt.wrong{background:#450a0a;border-color:#dc2626;color:#f87171}.qfb{font-size:12px;margin-top:6px;color:#94a3b8}.reflect-list{list-style:none;margin-top:14px}.reflect-list li{padding:9px 0;border-bottom:1px solid #1e293b;font-size:14px;color:#cbd5e1}.reflect-list li:before{content:"→ ";color:#60a5fa;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#0f172a;border-top:1px solid #1e293b;z-index:10}.navbtn{font-size:12px;font-weight:600;color:#93c5fd;background:#1e293b;border:1px solid #334155;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}.navbtn:hover{background:#334155}.navbtn:disabled{opacity:.3;pointer-events:none}.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#60a5fa;background:#1e3a5f;border:1px solid #1e40af;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}.autoria-badge:hover{background:#1e40af}</style></head>
<body>
<div class="hdr"><h1>Aula 14 — Tratamento de Erros <span class="chkbadge">⭐ Checkpoint 4</span></h1><div class="dots" id="dots"></div><a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></div>
<div class="slide-wrap" id="slide-wrap"></div>
<div class="nav"><button class="navbtn" id="prev" onclick="goTo(cur-1)">&#8592; Anterior</button><span style="font-size:12px;color:#64748b" id="counter"></span><button class="navbtn" id="next" onclick="goTo(cur+1)">Próximo &#8594;</button><a href="a14_demo_ao_vivo.html" class="navbtn" style="text-decoration:none;background:#1d4ed8;color:#fff;border-color:#1d4ed8">Ir para Demo &#8594;</a></div>
<script>
const SLIDES = [
{title:"Quando o pedido não chega", eyebrow:"Analogia", body:`<p>Hoje tratamos do que fazer quando algo dá errado: prato errado, demora, ou o restaurante fechado.</p><div class="cards"><div class="card"><h3>⏳ Carregando</h3><p>"Seu pedido está sendo preparado" — o cliente sabe que algo está acontecendo.</p></div><div class="card"><h3>⚠️ Erro</h3><p>O garçom avisa "não temos mais esse prato" — mensagem clara, não silêncio.</p></div><div class="card"><h3>✅ Sucesso</h3><p>O prato chega certinho na mesa.</p></div></div><div class="hl">💡 Um app profissional trata os três estados — não só o caminho feliz.</div>`},
{title:"A pegadinha do fetch()", eyebrow:"Conceito crítico", body:`<p><code class="fn">fetch()</code> só rejeita a Promise em falha de <strong>rede</strong> — não em erros HTTP como 404 ou 500!</p><div class="code-wrap"><span class="k">const</span> resposta = <span class="k">await</span> <span class="fn">fetch</span>(<span class="s">'/rota-inexistente'</span>);\nconsole.<span class="fn">log</span>(resposta.ok);     <span class="c">// false</span>\nconsole.<span class="fn">log</span>(resposta.status); <span class="c">// 404</span>\n<span class="c">// mas NÃO lança erro automaticamente aqui!</span></div>`},
{title:"Verificando response.ok", eyebrow:"Sintaxe", body:`<p>Você precisa checar manualmente e lançar (<code class="fn">throw</code>) o erro para o catch capturar.</p><div class="code-wrap"><span class="k">if</span> (!resposta.ok) {\n  <span class="k">throw new</span> <span class="fn">Error</span>(<span class="s">\`Erro \${resposta.status}\`</span>);\n}\n<span class="k">const</span> dados = <span class="k">await</span> resposta.<span class="fn">json</span>();</div>`},
{title:"Os 3 estados de interface", eyebrow:"Padrão de UI", body:`<p>Todo componente que busca dados deveria contemplar estes 3 estados:</p><div class="tag-grid" id="tags"></div><div class="tag-desc" id="tag-desc">Clique em um estado para ver a explicação.</div>`},
{title:"Boas práticas de autenticação", eyebrow:"Segurança básica", body:`<p>Enviando um token junto com a requisição:</p><div class="code-wrap"><span class="k">await</span> <span class="fn">fetch</span>(<span class="s">'/dados-privados'</span>, {\n  headers: { <span class="a">'Authorization'</span>: <span class="s">'Bearer TOKEN'</span> }\n});</div><div class="hl">🔒 Nunca deixe tokens visíveis em código público. Trate 401 (não autenticado) e 403 (sem permissão) separadamente.</div>`},
{title:"Verificando o entendimento", eyebrow:"Quiz rápido", body:`<div class="quiz-block" id="q1"><p>1. fetch() rejeita a Promise para um 404?</p></div><div class="quiz-block" id="q2" style="margin-top:10px"><p>2. O que resposta.ok verifica?</p></div>`},
{title:"Checkpoint 4 do projeto", eyebrow:"Fechamento", body:`<ul class="reflect-list"><li>fetch() não lança erro sozinho para status HTTP de falha.</li><li>Sempre verifique resposta.ok e trate os 3 estados de UI.</li><li>Autenticação básica: headers, tokens, 401 vs 403.</li><li>Hoje é checkpoint 4 — aplique isso no seu projeto final!</li></ul>`}
];
let cur=0;
function buildDots(){document.getElementById('dots').innerHTML=SLIDES.map((_,i)=>`<div class="dot" onclick="goTo(${i})" id="d${i}"></div>`).join('');}
function buildSlides(){document.getElementById('slide-wrap').innerHTML=SLIDES.map((s,i)=>`<div class="slide" id="s${i}"><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}</div>`).join('');}
function goTo(i){if(i<0||i>=SLIDES.length)return;cur=i;document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));document.getElementById(`s${i}`).classList.add('active');document.getElementById(`d${i}`).classList.add('active');document.getElementById('counter').textContent=`${i+1} / ${SLIDES.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===SLIDES.length-1;if(i===3)buildTags();if(i===5)buildQuiz();}
function buildTags(){const el=document.getElementById('tags');if(!el||el.dataset.built)return;el.dataset.built='1';const tags=[['carregando','Exibido enquanto a requisição está em andamento.'],['erro','Exibido quando algo falha — mensagem amigável, não técnica demais.'],['sucesso','Exibido quando os dados chegam corretamente.']];el.innerHTML=tags.map(t=>`<span class="tag" onclick="showTag('${t[0]}','${t[1].replace(/'/g,"\\'")}')">${t[0]}</span>`).join('');}
function showTag(tag,desc){document.getElementById('tag-desc').textContent=`${tag}: ${desc}`;}
function buildQuiz(){const q1=document.getElementById('q1');if(!q1.dataset.built){q1.dataset.built='1';const opts=[['Sim, sempre',false],['Não, só em falha de rede',true],['Só em 500',false]];q1.innerHTML+=opts.map(o=>`<button class="qopt" onclick="answer(this,${o[1]},'fb1')">${o[0]}</button>`).join('')+`<div class="qfb" id="fb1"></div>`;}const q2=document.getElementById('q2');if(!q2.dataset.built){q2.dataset.built='1';const opts=[['Se o status está entre 200-299',true],['Se o JSON é válido',false],['Se a internet está conectada',false]];q2.innerHTML+=opts.map(o=>`<button class="qopt" onclick="answer(this,${o[1]},'fb2')">${o[0]}</button>`).join('')+`<div class="qfb" id="fb2"></div>`;}}
function answer(el,correct,fbId){const parent=el.parentElement;parent.querySelectorAll('.qopt').forEach(b=>b.style.pointerEvents='none');el.classList.add(correct?'correct':'wrong');document.getElementById(fbId).textContent=correct?'✓ Correto!':'✗ Não é isso — revise o conceito.';}
buildDots();buildSlides();goTo(0);
</script>
</body></html>
