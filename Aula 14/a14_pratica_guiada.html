<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="author" content="@karizeviecelli"><meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados."><title>Prática Guiada — Aula 14 Tratamento de Erros</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;color:#1e293b;background:#f8fafc;min-height:100vh;padding:24px 24px 70px}.wrap{max-width:820px;margin:0 auto}.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.hdr h1{font-size:16px;font-weight:600}.hdr p{font-size:12px;color:#94a3b8}.chkbadge{font-size:10px;font-weight:700;background:#fef3c7;color:#b45309;padding:2px 9px;border-radius:20px;margin-left:6px}.prog-track{height:3px;background:#e2e8f0;border-radius:2px;margin-bottom:20px;overflow:hidden}.prog-fill{height:100%;background:#3b82f6;border-radius:2px;transition:width .3s ease}.acc-item{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff}.acc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}.acc-num{width:26px;height:26px;border-radius:50%;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}.acc-num.done{background:#dcfce7;color:#16a34a}.acc-title{font-size:13px;font-weight:600;flex:1}.acc-chevron{font-size:11px;color:#94a3b8;transition:transform .2s}.acc-item.open .acc-chevron{transform:rotate(90deg)}.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}.acc-item.open .acc-body{max-height:800px}.acc-inner{padding:0 16px 16px 52px;font-size:13px;line-height:1.7;color:#475569}.acc-inner code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:'Courier New',monospace;font-size:12px;color:#1e293b}.code-block{background:#1e293b;color:#e2e8f0;padding:12px 14px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;line-height:1.7;margin:8px 0;overflow-x:auto;white-space:pre}.k{color:#93C5FD}.a{color:#FDE68A}.s{color:#FDA4AF}.t{color:#E2E8F0}.c{color:#64748b;font-style:italic}.fn{color:#5EEAD4}.hint-btn{font-size:11px;font-weight:600;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;padding:4px 10px;border-radius:6px;cursor:pointer;margin-top:6px;font-family:inherit}.hint-btn:hover{background:#dbeafe}.hint-box{display:none;margin-top:8px;padding:10px 12px;background:#fefce8;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#854d0e}.hint-box.show{display:block}.mark-btn{font-size:12px;font-weight:600;color:#fff;background:#16a34a;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;margin-top:10px;font-family:inherit}.mark-btn:hover{background:#15803d}.mark-btn.done{background:#94a3b8;pointer-events:none}.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}.autoria-badge:hover{background:#bfdbfe}</style></head>
<body>
<div class="wrap">
  <div class="hdr"><h1>Prática Guiada — Aula 14 <span class="chkbadge">⭐ Checkpoint 4</span></h1><p>Passo a passo com apoio &nbsp;<a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></p></div>
  <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div id="acc-list"></div>
</div>
<script>
const STEPS = [
  {title:"Passo 1 — Parta da página da Aula 13",
   body:`Reabra a página que busca dados de <code>jsonplaceholder.typicode.com</code>. Ela já tem <code>fetch()</code> funcionando — vamos deixá-la mais robusta.`,
   hint:"Se não tiver a página da Aula 13 pronta, use qualquer HTML simples com um botão que chama uma função async."},
  {title:"Passo 2 — Adicione o estado de carregamento",
   body:`Antes de chamar <code>fetch</code>, defina o conteúdo do <code>#app</code> como uma mensagem de carregamento.`,
   code:`<span class="k">const</span> app = document.<span class="fn">getElementById</span>(<span class="s">'app'</span>);\napp.innerHTML = <span class="s">'&lt;p&gt;Carregando...&lt;/p&gt;'</span>;`,
   hint:"Esse innerHTML de carregamento precisa vir ANTES do await fetch(), não depois."},
  {title:"Passo 3 — Verifique resposta.ok",
   body:`Depois do <code>await fetch(...)</code>, cheque se <code>resposta.ok</code> é falso e, se for, lance um erro manualmente com <code>throw</code>.`,
   code:`<span class="k">if</span> (!resposta.ok) {\n  <span class="k">throw new</span> <span class="fn">Error</span>(<span class="s">\`Erro \${resposta.status}: \${resposta.statusText}\`</span>);\n}`,
   hint:"Sem esse throw, um 404 passaria batido e seu código tentaria processar um JSON que talvez nem exista."},
  {title:"Passo 4 — Capture o erro com try/catch",
   body:`Envolva a chamada inteira em <code>try/catch</code>. No <code>catch</code>, mostre uma mensagem amigável ao usuário.`,
   code:`<span class="k">catch</span> (erro) {\n  app.innerHTML = <span class="s">\`&lt;p&gt;Algo deu errado: \${erro.message}&lt;/p&gt;\`</span>;\n}`,
   hint:"erro.message contém o texto do Error que você lançou (ou da falha de rede, se for o caso)."},
  {title:"Passo 5 — Teste forçando um erro de propósito",
   body:`Troque temporariamente a URL para algo inválido (ex.: <code>/posts/999999999</code>) e confirme que a mensagem de erro aparece corretamente. Depois, volte a URL certa.`,
   hint:"Esse é o momento de checkpoint: mostre ao professor tanto o caminho de sucesso quanto o de erro funcionando."}
];
function buildAcc(){const list=document.getElementById('acc-list');list.innerHTML=STEPS.map((s,i)=>`
  <div class="acc-item" id="acc-${i}">
    <div class="acc-head" onclick="toggle(${i})"><div class="acc-num" id="num-${i}">${i+1}</div><div class="acc-title">${s.title}</div><div class="acc-chevron">&#9656;</div></div>
    <div class="acc-body"><div class="acc-inner"><p>${s.body}</p>${s.code?`<div class="code-block">${s.code}</div>`:''}<button class="hint-btn" onclick="toggleHint(${i}, event)">💡 Dica</button><div class="hint-box" id="hint-${i}">${s.hint}</div><br><button class="mark-btn" id="mark-${i}" onclick="markDone(${i}, event)">Marcar como concluído</button></div></div>
  </div>`).join('');}
function toggle(i){const el=document.getElementById(`acc-${i}`);document.querySelectorAll('.acc-item').forEach(x=>{if(x.id!==`acc-${i}`)x.classList.remove('open');});el.classList.toggle('open');}
function toggleHint(i,e){e.stopPropagation();document.getElementById(`hint-${i}`).classList.toggle('show');}
let doneCount=0;
function markDone(i,e){e.stopPropagation();const btn=document.getElementById(`mark-${i}`);if(btn.classList.contains('done'))return;btn.classList.add('done');btn.textContent='✓ Concluído';document.getElementById(`num-${i}`).classList.add('done');document.getElementById(`num-${i}`).textContent='✓';doneCount++;document.getElementById('prog').style.width=`${Math.round((doneCount/STEPS.length)*100)}%`;if(i<STEPS.length-1){document.querySelectorAll('.acc-item').forEach(x=>x.classList.remove('open'));document.getElementById(`acc-${i+1}`).classList.add('open');}}
buildAcc();document.getElementById('acc-0').classList.add('open');
</script>
<div style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #bfdbfe;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;z-index:9999;gap:12px">
  <a href="a14_demo_ao_vivo.html" style="display:inline-flex;align-items:center;gap:6px;background:#f8fafc;color:#64748b;font-size:12px;font-weight:600;padding:7px 15px;border-radius:8px;text-decoration:none;border:1px solid #e2e8f0">&#8592; Demo</a>
  <div style="font-size:11px;color:#94a3b8;font-family:'Courier New',monospace;text-align:center;flex:1;line-height:1.6">Aula 14 &middot; 3 de 5 &middot; Prática Guiada<br><a href="https://instagram.com/karizeviecelli" target="_blank" style="color:#2563eb;text-decoration:none;font-weight:600;font-size:10px">© @karizeviecelli</a></div>
  <a href="a14_desafio.html" style="display:inline-flex;align-items:center;gap:6px;background:#2563eb;color:#fff;font-size:12px;font-weight:600;padding:7px 15px;border-radius:8px;text-decoration:none">Desafio &#8594;</a>
</div>
</body></html>
