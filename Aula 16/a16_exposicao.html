<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="author" content="@karizeviecelli"><meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados."><title>Exposição — Aula 16 Refinamento e Publicação</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}.hdr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#0f172a;border-bottom:1px solid #1e293b;z-index:10}.hdr h1{font-size:13px;font-weight:600;color:#94a3b8}.chkbadge{font-size:10px;font-weight:700;background:#78350f;color:#fbbf24;padding:2px 9px;border-radius:20px;margin-left:8px}.dots{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#334155;cursor:pointer;transition:background .2s}.dot.active{background:#3b82f6}.slide-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 40px}.slide{display:none;max-width:880px;width:100%}.slide.active{display:block;animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;font-weight:600;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.slide h2{font-size:28px;font-weight:700;margin-bottom:18px;color:#f1f5f9}.slide p{font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px}.card h3{font-size:14px;color:#93c5fd;margin-bottom:6px}.card p{font-size:13px;color:#94a3b8;margin:0}.code-wrap{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;margin-top:14px;overflow-x:auto;white-space:pre}.k{color:#93C5FD}.a{color:#FDE68A}.s{color:#FDA4AF}.t{color:#E2E8F0}.c{color:#64748b;font-style:italic}.fn{color:#5EEAD4}.hl{background:#1e3a5f;border-left:3px solid #3b82f6;padding:10px 16px;border-radius:6px;font-size:13px;color:#bfdbfe;margin-top:14px}.tag-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tag{background:#1e293b;border:1px solid #334155;color:#93c5fd;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s}.tag:hover{background:#334155}.tag-desc{margin-top:10px;font-size:13px;color:#94a3b8;min-height:18px}.reflect-list{list-style:none;margin-top:14px}.reflect-list li{padding:9px 0;border-bottom:1px solid #1e293b;font-size:14px;color:#cbd5e1}.reflect-list li:before{content:"→ ";color:#60a5fa;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#0f172a;border-top:1px solid #1e293b;z-index:10}.navbtn{font-size:12px;font-weight:600;color:#93c5fd;background:#1e293b;border:1px solid #334155;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}.navbtn:hover{background:#334155}.navbtn:disabled{opacity:.3;pointer-events:none}.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#60a5fa;background:#1e3a5f;border:1px solid #1e40af;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}.autoria-badge:hover{background:#1e40af}</style></head>
<body>
<div class="hdr"><h1>Aula 16 — Refinamento e Publicação <span class="chkbadge">⭐ Checkpoint 5</span></h1><div class="dots" id="dots"></div><a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></div>
<div class="slide-wrap" id="slide-wrap"></div>
<div class="nav"><button class="navbtn" id="prev" onclick="goTo(cur-1)">&#8592; Anterior</button><span style="font-size:12px;color:#64748b" id="counter"></span><button class="navbtn" id="next" onclick="goTo(cur+1)">Próximo &#8594;</button><a href="a16_demo_ao_vivo.html" class="navbtn" style="text-decoration:none;background:#1d4ed8;color:#fff;border-color:#1d4ed8">Ir para Demo &#8594;</a></div>
<script>
const SLIDES = [
{title:"A inauguração da casa", eyebrow:"Analogia", body:`<p>Antes de entregar a chave, um bom construtor faz uma vistoria completa. Hoje é a vez do seu projeto passar por essa vistoria — e ganhar um endereço público.</p><div class="cards"><div class="card"><h3>🔍 Testar</h3><p>A vistoria — percorrer cada funcionalidade verificando se tudo funciona.</p></div><div class="card"><h3>👥 Code review</h3><p>Chamar um colega arquiteto para uma segunda olhada.</p></div><div class="card"><h3>📋 Git</h3><p>A planta oficial registrada — histórico organizado do projeto.</p></div><div class="card"><h3>🌍 GitHub Pages</h3><p>A inauguração — a casa agora tem endereço público.</p></div></div>`},
{title:"Testando como um usuário malvado", eyebrow:"Passo 1", body:`<p>Percorra o checklist testando fora do "caminho feliz":</p><div class="code-wrap">[ ] Cada botão/link faz o que deveria?\n[ ] Busca funciona com dados válidos?\n[ ] Busca NÃO quebra com dados inválidos/vazios?\n[ ] Layout se adapta em telas pequenas?\n[ ] Existe erro no console do DevTools?\n[ ] Loading aparece e desaparece corretamente?</div>`},
{title:"Code review entre colegas", eyebrow:"Passo 2", body:`<p>O que observar ao revisar o código de um colega:</p><div class="tag-grid" id="tags"></div><div class="tag-desc" id="tag-desc">Clique em um item para ver a explicação.</div><div class="hl">💬 Feedback bom é: específico, construtivo e respeitoso.</div>`},
{title:"Organizando o repositório Git", eyebrow:"Passo 3", body:`<p>Os comandos essenciais para registrar seu projeto:</p><div class="code-wrap"><span class="fn">git</span> init\n<span class="fn">git</span> add .\n<span class="fn">git</span> commit -m <span class="s">"Primeira versão do projeto"</span>\n<span class="fn">git</span> remote add origin &lt;url-do-repo&gt;\n<span class="fn">git</span> push -u origin main</div>`},
{title:"Publicando com GitHub Pages", eyebrow:"Passo 4", body:`<p>Transforme seu repositório em um site público, gratuito:</p><div class="code-wrap">1. Settings → Pages\n2. Source: branch main, pasta / (root)\n3. Salvar e aguardar\n4. https://seu-usuario.github.io/repositorio/</div><div class="hl">🌍 Sem servidor próprio, sem custo — só arquivos estáticos servidos publicamente.</div>`},
{title:"Checkpoint 5: projeto no ar", eyebrow:"Fechamento", body:`<ul class="reflect-list"><li>Testado sistematicamente, como um usuário real testaria.</li><li>Revisado por um colega, com feedback construtivo.</li><li>Versionado com Git, com commits claros.</li><li>Publicado no GitHub Pages — acessível ao mundo!</li><li>Próxima aula: apresentação do projeto final para a turma.</li></ul>`}
];
let cur=0;
function buildDots(){document.getElementById('dots').innerHTML=SLIDES.map((_,i)=>`<div class="dot" onclick="goTo(${i})" id="d${i}"></div>`).join('');}
function buildSlides(){document.getElementById('slide-wrap').innerHTML=SLIDES.map((s,i)=>`<div class="slide" id="s${i}"><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}</div>`).join('');}
function goTo(i){if(i<0||i>=SLIDES.length)return;cur=i;document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));document.getElementById(`s${i}`).classList.add('active');document.getElementById(`d${i}`).classList.add('active');document.getElementById('counter').textContent=`${i+1} / ${SLIDES.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===SLIDES.length-1;if(i===2)buildTags();}
function buildTags(){const el=document.getElementById('tags');if(!el||el.dataset.built)return;el.dataset.built='1';const tags=[['Organização','Arquivos separados em HTML/CSS/JS?'],['Nomes claros','Variáveis e funções fazem sentido?'],['Comentários','Explicam partes não óbvias do código?'],['Tratamento de erro','Está presente, como na Aula 14?'],['Duplicação','Alguma parte repetida sem necessidade?']];el.innerHTML=tags.map(t=>`<span class="tag" onclick="showTag('${t[0]}','${t[1].replace(/'/g,"\\'")}')">${t[0]}</span>`).join('');}
function showTag(tag,desc){document.getElementById('tag-desc').textContent=`${tag}: ${desc}`;}
buildDots();buildSlides();goTo(0);
</script>
</body></html>
