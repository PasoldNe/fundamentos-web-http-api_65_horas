<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exposição Dialogada — JavaScript: DOM e Eventos · Aula 10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#1e293b;background:#f8fafc;overflow:hidden}

#app{display:flex;flex-direction:column;height:100vh;padding-bottom:52px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;flex-wrap:wrap;gap:8px}
.hdr-left{display:flex;align-items:center;gap:12px}
.badge{background:#1d4ed8;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.hdr-title{font-size:14px;font-weight:600;color:#1e293b}
.hdr-sub{font-size:12px;color:#94a3b8;margin-top:1px}
.timer{font-size:13px;font-weight:500;color:#64748b;background:#f1f5f9;padding:5px 14px;border-radius:8px;border:1px solid #e2e8f0;min-width:64px;text-align:center;font-family:'Courier New',monospace}
.timer.warn{color:#d97706;background:#fffbeb;border-color:#fcd34d}
.timer.danger{color:#dc2626;background:#fef2f2;border-color:#fca5a5}

/* PROGRESS DOTS */
.dots{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:all .2s;flex-shrink:0}
.dot.active{background:#1d4ed8;transform:scale(1.45)}
.dot.done{background:#93c5fd;opacity:.6}
.dot-sep{width:12px;height:1px;background:#e2e8f0;flex-shrink:0}

/* SLIDE AREA */
.slide-wrap{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;padding:24px 28px;overflow-y:auto;display:none}
.slide.active{display:block;animation:sIn .25s ease}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* TYPOGRAPHY */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.slide-title{font-size:22px;font-weight:600;color:#1e293b;line-height:1.2;margin-bottom:6px}
.slide-sub{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:18px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px}
.card.accent{border-left:3px solid #1d4ed8}
.card-icon{font-size:20px;margin-bottom:6px}
.card-title{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:4px}
.card-body{font-size:12px;color:#64748b;line-height:1.55}
.card-body em{font-style:italic}
.card-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* CODE */
.code-wrap{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin:10px 0}
.code-hdr{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:7px 14px;border-bottom:1px solid #e2e8f0}
.code-lang{font-size:11px;font-weight:500;color:#64748b}
.cdots{display:flex;gap:5px}
.cdot{width:10px;height:10px;border-radius:50%}
pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;font-size:12px;line-height:1.75;overflow-x:auto;font-family:'Courier New',monospace;white-space:pre}
.k{color:#93c5fd}.kv{color:#6ee7b7}.a{color:#fde68a}.s{color:#fda4af}.t{color:#e2e8f0}.c{color:#475569;font-style:italic}.fn{color:#c4b5fd}

/* COMPARE */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:560px){.compare{grid-template-columns:1fr}}
.comp-side{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.comp-hdr{padding:8px 14px;font-size:12px;font-weight:600}
.comp-body{padding:10px 14px;font-size:12px;color:#64748b;line-height:1.65}
.comp-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* TAG EXPLORER */
.tag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
@media(max-width:500px){.tag-grid{grid-template-columns:1fr 1fr}}
.tag-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.tag-item:hover{border-color:#93c5fd;background:#eff6ff}
.tag-item.tag-on{border-color:#1d4ed8;background:#eff6ff}
.tag-code{font-size:12px;font-weight:600;color:#1d4ed8;font-family:'Courier New',monospace;margin-bottom:3px}
.tag-name{font-size:11px;color:#94a3b8}
.tag-preview{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;min-height:56px;font-size:13px;color:#64748b;line-height:1.6}
.tag-preview strong{color:#1e293b;font-weight:600;font-family:'Courier New',monospace}

/* LIVE DEMO BOX */
.live-box{border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:10px 0 16px;background:#fff;text-align:center}
.live-title{font-size:16px;font-weight:600;color:#1e293b;margin-bottom:12px;transition:all .2s}
.live-title.destaque{color:#1d4ed8;background:#eff6ff;padding:6px 14px;border-radius:8px;display:inline-block}
.live-btn{font-size:13px;font-weight:600;background:#1d4ed8;color:#fff;border:none;padding:9px 20px;border-radius:8px;cursor:pointer;font-family:inherit;transition:background .15s}
.live-btn:hover{background:#1e40af}

/* QUIZ */
.quiz-q{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:12px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e293b;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.quiz-opt:hover:not(.correct):not(.wrong):not(.dimmed){border-color:#93c5fd;background:#eff6ff}
.quiz-opt.correct{background:#f0fdf4;border-color:#86efac;color:#15803d;pointer-events:none}
.quiz-opt.wrong{background:#fef2f2;border-color:#fca5a5;color:#dc2626;pointer-events:none}
.quiz-opt.dimmed{opacity:.4;pointer-events:none}
.quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-block{margin-bottom:18px}

/* REFLECT */
.reflect-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.reflect-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px}
.reflect-num{width:24px;height:24px;min-width:24px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.reflect-text{font-size:13px;color:#64748b;line-height:1.55}
.reflect-text strong{color:#1e293b;font-weight:600}

/* HIGHLIGHT BOX */
.hl{background:#fffbeb;border-left:3px solid #f59e0b;padding:10px 14px;font-size:13px;color:#78350f;line-height:1.55;margin:10px 0}
.hl strong{color:#92400e;font-weight:600}

/* NAV BAR */
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.nav-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:7px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:#e2e8f0;color:#1e293b}
.nav-btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.nav-btn.primary:hover{background:#1e40af}
.nav-btn:disabled{opacity:.35;pointer-events:none}
.nav-counter{font-size:12px;color:#94a3b8}

code{font-family:'Courier New',monospace;font-size:12px;background:#f1f5f9;padding:1px 5px;border-radius:3px;border:1px solid #e2e8f0}

/* ── Autoria @karizeviecelli ── */
.autoria-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:#2563eb;
  background:#eff6ff;border:1px solid #bfdbfe;
  padding:2px 9px;border-radius:20px;text-decoration:none;
  font-family:'Courier New',monospace;letter-spacing:.02em;white-space:nowrap;
}
.autoria-badge:hover{background:#bfdbfe;color:#1e40af}
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <span class="badge">Aula 10</span>
      <div>
        <div class="hdr-title">JavaScript: DOM e Eventos — Exposição Dialogada</div>
        <div class="hdr-sub">30 minutos · Projetor · Turma</div>
      </div>
    </div>
    <a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a>
    <div class="timer" id="timer">30:00</div>
  <button onclick="window.location.href='a10_demo_ao_vivo.html'" style="font-size:12px;font-weight:600;background:#fff;border:1.5px solid #1d4ed8;color:#1d4ed8;padding:5px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='#fff'">💻 Demo ao Vivo →</button>
  </div>

  <div class="dots" id="dots-bar"></div>

  <div class="slide-wrap" id="slide-wrap"></div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="nav(-1)" disabled>← Anterior</button>
    <span class="nav-counter" id="counter">1 / 9</span>
    <button class="nav-btn primary" id="btn-next" onclick="nav(1)">Próximo →</button>
  </div>
</div>

<script>
const SLIDES = [
  {
    id:'intro', time:3,
    render:()=>`
      <div class="eyebrow">Abertura · 3 minutos</div>
      <div class="slide-title">O cérebro ganha mãos e sentidos</div>
      <div class="slide-sub">O cérebro da casa já sabia decidir e repetir. Hoje ele ganha mãos para tocar a casa, e sentidos para perceber o que o usuário faz.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">✋</div>
          <div class="card-title">querySelector</div>
          <div class="card-body">"Pegue o formulário de cadastro" — apontar para um elemento.</div>
        </div>
        <div class="card accent">
          <div class="card-icon">🎨</div>
          <div class="card-title">innerHTML / classList / style</div>
          <div class="card-body">Mudar o texto, a cor, ligar/desligar algo.</div>
        </div>
        <div class="card">
          <div class="card-icon">👂</div>
          <div class="card-title">addEventListener</div>
          <div class="card-body">Sentir quando alguém clica, digita ou envia.</div>
        </div>
        <div class="card">
          <div class="card-icon">✅</div>
          <div class="card-title">Validação de formulário</div>
          <div class="card-body">Tudo isso junto, resolvendo um problema real.</div>
        </div>
      </div>
      <div class="hl"><strong>Pergunta para a turma:</strong> Já preencheram um formulário que avisou "e-mail inválido" antes mesmo de enviar? É exatamente isso que vamos construir hoje.</div>`
  },
  {
    id:'selecionar', time:6,
    render:()=>`
      <div class="eyebrow">As mãos · 6 minutos</div>
      <div class="slide-title">Selecionando elementos</div>
      <div class="slide-sub">querySelector usa a mesma sintaxe de seletores que já conhecemos do CSS.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">JavaScript · seleção</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">const</span> <span class="t">titulo</span> <span class="t">=</span> <span class="fn">document</span><span class="t">.</span><span class="fn">getElementById</span><span class="t">(</span><span class="s">"titulo-pagina"</span><span class="t">);</span>

<span class="k">const</span> <span class="t">botao</span> <span class="t">=</span> <span class="fn">document</span><span class="t">.</span><span class="fn">querySelector</span><span class="t">(</span><span class="s">".botao-enviar"</span><span class="t">);</span>
<span class="k">const</span> <span class="t">campoEmail</span> <span class="t">=</span> <span class="fn">document</span><span class="t">.</span><span class="fn">querySelector</span><span class="t">(</span><span class="s">"#email"</span><span class="t">);</span>

<span class="k">const</span> <span class="t">todosOsCards</span> <span class="t">=</span> <span class="fn">document</span><span class="t">.</span><span class="fn">querySelectorAll</span><span class="t">(</span><span class="s">".card"</span><span class="t">);</span></pre>
      </div>
      <div class="hl"><strong>querySelector</strong> pega o PRIMEIRO elemento. <strong>querySelectorAll</strong> pega TODOS, em uma lista.</div>`
  },
  {
    id:'manipular', time:6,
    render:()=>`
      <div class="eyebrow">Reorganizando a casa · 6 minutos</div>
      <div class="slide-title">innerHTML, classList e style</div>
      <div class="slide-sub">Depois de "pegar" o elemento, o cérebro pode mudá-lo.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">JavaScript · manipulação</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="t">titulo</span><span class="t">.</span><span class="a">innerHTML</span> <span class="t">=</span> <span class="s">"Bem-vindo(a) de volta!"</span><span class="t">;</span>

<span class="t">card</span><span class="t">.</span><span class="fn">classList</span><span class="t">.</span><span class="fn">add</span><span class="t">(</span><span class="s">"destaque"</span><span class="t">);</span>
<span class="t">card</span><span class="t">.</span><span class="fn">classList</span><span class="t">.</span><span class="fn">toggle</span><span class="t">(</span><span class="s">"ativo"</span><span class="t">);</span>

<span class="t">card</span><span class="t">.</span><span class="fn">style</span><span class="t">.</span><span class="a">backgroundColor</span> <span class="t">=</span> <span class="s">"#eff6ff"</span><span class="t">;</span></pre>
      </div>
      <div class="hl"><strong>Boa prática:</strong> prefira classList a style sempre que possível — o JS decide QUANDO, o CSS decide COMO fica.</div>`
  },
  {
    id:'eventos', time:6,
    render:()=>`
      <div class="eyebrow">Os sentidos · 6 minutos</div>
      <div class="slide-title">addEventListener</div>
      <div class="slide-sub">"Escuta" um tipo de evento e executa uma função quando ele acontece.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">JavaScript · eventos</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="t">botao</span><span class="t">.</span><span class="fn">addEventListener</span><span class="t">(</span><span class="s">"click"</span><span class="t">,</span> <span class="k">function</span> <span class="t">()</span> <span class="t">{</span>
  <span class="fn">console</span><span class="t">.</span><span class="fn">log</span><span class="t">(</span><span class="s">"Botão foi clicado!"</span><span class="t">);</span>
<span class="t">});</span></pre>
      </div>
      <div class="live-box">
        <div class="live-title" id="live-demo-title">Clique no botão abaixo</div>
        <button class="live-btn" onclick="document.getElementById('live-demo-title').textContent='Botão foi clicado!';document.getElementById('live-demo-title').classList.add('destaque')">Clicar aqui</button>
      </div>`
  },
  {
    id:'preventdefault', time:5,
    render:()=>`
      <div class="eyebrow">Controle total · 5 minutos</div>
      <div class="slide-title">O objeto event e preventDefault()</div>
      <div class="slide-sub">Por padrão, um formulário recarrega a página ao ser enviado. preventDefault() cancela isso.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">JavaScript · preventDefault</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="t">formulario</span><span class="t">.</span><span class="fn">addEventListener</span><span class="t">(</span><span class="s">"submit"</span><span class="t">,</span> <span class="k">function</span> <span class="t">(</span><span class="t">event</span><span class="t">)</span> <span class="t">{</span>
  <span class="t">event</span><span class="t">.</span><span class="fn">preventDefault</span><span class="t">();</span> <span class="c">// não recarrega a página</span>

  <span class="fn">console</span><span class="t">.</span><span class="fn">log</span><span class="t">(</span><span class="s">"Formulário capturado!"</span><span class="t">);</span>
<span class="t">});</span></pre>
      </div>
      <div class="hl"><strong>Essencial:</strong> sem preventDefault(), a página recarrega antes que qualquer validação em JavaScript tenha chance de rodar.</div>`
  },
  {
    id:'validacao', time:5,
    render:()=>`
      <div class="eyebrow">Tudo junto · 5 minutos</div>
      <div class="slide-title">Validação de formulário</div>
      <div class="slide-sub">Capturar submit, ler .value, testar com if, mostrar erro com innerHTML + classList.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">JavaScript · validação</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">if</span> <span class="t">(</span><span class="t">campoEmail</span><span class="t">.</span><span class="a">value</span> <span class="t">===</span> <span class="s">""</span><span class="t">)</span> <span class="t">{</span>
  <span class="t">mensagemErro</span><span class="t">.</span><span class="a">innerHTML</span> <span class="t">=</span> <span class="s">"O e-mail é obrigatório."</span><span class="t">;</span>
  <span class="t">mensagemErro</span><span class="t">.</span><span class="fn">classList</span><span class="t">.</span><span class="fn">add</span><span class="t">(</span><span class="s">"visivel"</span><span class="t">);</span>
  <span class="k">return</span><span class="t">;</span>
<span class="t">}</span></pre>
      </div>`
  },
  {
    id:'quiz', time:3,
    render:()=>`
      <div class="eyebrow">Verificação de aprendizagem · 3 minutos</div>
      <div class="slide-title">Quiz rápido — turma responde junto</div>
      <div class="slide-sub">Sem pressão. O objetivo é consolidar o que aprendemos.</div>
      <div class="quiz-block">
        <div class="quiz-q">1. Sem chamar event.preventDefault() no submit, o que acontece ao enviar o formulário?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>A</span>Nada acontece</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb1')"><span>B</span>A página recarrega, interrompendo o JavaScript</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>C</span>Um erro é lançado obrigatoriamente</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>D</span>O formulário é bloqueado permanentemente</div>
        </div>
        <div class="quiz-feedback" id="fb1" style="background:#f0fdf4;color:#15803d">Correto! Por isso preventDefault() é quase sempre a primeira linha dentro do listener de submit.</div>
      </div>
      <div class="quiz-block">
        <div class="quiz-q">2. Você quer alternar a visibilidade de um menu mobile a cada clique. Qual método é mais direto?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>A</span>classList.add()</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>B</span>classList.remove()</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb2')"><span>C</span>classList.toggle()</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>D</span>innerHTML</div>
        </div>
        <div class="quiz-feedback" id="fb2" style="background:#f0fdf4;color:#15803d">Correto! toggle() adiciona se não tiver, remove se já tiver — perfeito para "liga/desliga".</div>
      </div>`
  },
  {
    id:'curiosidades', time:1,
    render:()=>`
      <div class="eyebrow">Bônus · 1 minuto</div>
      <div class="slide-title">Você sabia?</div>
      <div class="slide-sub">Fatos sobre DOM e eventos que valem compartilhar com a turma.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">🌳</div>
          <div class="card-title">DOM = Document Object Model</div>
          <div class="card-body">É a representação do HTML em forma de "árvore" de objetos que o JavaScript pode ler e modificar.</div>
        </div>
        <div class="card accent">
          <div class="card-icon">🎈</div>
          <div class="card-title">Eventos "borbulham"</div>
          <div class="card-body">Por padrão, um evento disparado num elemento filho também é percebido pelos elementos pai — chamado de "event bubbling".</div>
        </div>
        <div class="card">
          <div class="card-icon">⚠️</div>
          <div class="card-title">innerHTML tem um risco</div>
          <div class="card-body">Inserir texto de usuários direto com innerHTML pode abrir brechas de segurança (XSS) — para texto puro, textContent é mais seguro.</div>
        </div>
        <div class="card">
          <div class="card-icon">🔌</div>
          <div class="card-title">Um elemento pode ter vários listeners</div>
          <div class="card-body">addEventListener permite registrar múltiplas funções para o mesmo evento, sem que uma sobrescreva a outra.</div>
        </div>
      </div>`
  },
  {
    id:'fechamento', time:1,
    render:()=>`
      <div class="eyebrow">Encerramento · 1 minuto</div>

let cur = 0;
let timerInterval = null;
let timerStarted = false;

function buildDots() {
  const bar = document.getElementById('dots-bar');
  SLIDES.forEach((s, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = 'Slide ' + (i + 1);
    d.onclick = () => goTo(i);
    bar.appendChild(d);
    if (i < SLIDES.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'dot-sep';
      bar.appendChild(sep);
    }
  });
}

function buildSlides() {
  const wrap = document.getElementById('slide-wrap');
  SLIDES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.id = 'sl-' + s.id;
    div.innerHTML = s.render();
    wrap.appendChild(div);
  });
}

function goTo(i) {
  const prev = cur;
  document.getElementById('sl-' + SLIDES[prev].id).classList.remove('active');
  const dots = document.querySelectorAll('.dot');
  dots[prev].classList.remove('active');
  if (i > prev) dots[prev].classList.add('done');

  cur = i;
  const el = document.getElementById('sl-' + SLIDES[cur].id);
  el.innerHTML = SLIDES[cur].render();
  el.classList.add('active');
  dots[cur].classList.add('active');
  dots[cur].classList.remove('done');

  document.getElementById('btn-prev').disabled = cur === 0;
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = cur === SLIDES.length - 1;
  btnNext.textContent = cur === SLIDES.length - 1 ? 'Finalizar' : 'Próximo →';
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + SLIDES.length;

  if (!timerStarted) { timerStarted = true; startTimer(); }
}

function nav(d) {
  const ni = cur + d;
  if (ni >= 0 && ni < SLIDES.length) goTo(ni);
}

function startTimer() {
  let rem = 30 * 60;
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    rem--;
    if (rem <= 0) { clearInterval(timerInterval); el.textContent = '00:00'; el.className = 'timer danger'; return; }
    const m = Math.floor(rem / 60), s = rem % 60;
    el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    if (rem <= 300) el.className = 'timer warn';
    if (rem <= 60)  el.className = 'timer danger';
  }, 1000);
}

function answer(el, type, fbId) {
  const block = el.closest('.quiz-block');
  block.querySelectorAll('.quiz-opt').forEach(o => {
    if (o === el) o.classList.add(type === 'c' ? 'correct' : 'wrong');
    else o.classList.add('dimmed');
  });
  const fb = document.getElementById(fbId);
  if (type !== 'c') {
    fb.style.background = '#fef2f2';
    fb.style.color = '#dc2626';
    fb.textContent = 'Não exatamente — pense no que cada método realmente faz.';
  }
  fb.style.display = 'block';
}

buildDots();
buildSlides();
document.getElementById('btn-prev').disabled = true;
</script>
