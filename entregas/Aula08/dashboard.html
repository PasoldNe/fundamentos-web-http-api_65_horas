<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag de viewport (Aula 08) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <!-- Áreas do Grid (Aula 07) -->
        <header class="cabecalho">
            <h1>Meu Painel</h1>
        </header>
        
        <nav class="menu">
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Relatórios</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </nav>
        
        <main class="conteudo">
            <h2>Estatísticas Gerais</h2>
            <div class="cards-stats">
                <div class="stat-card">
                    <img src="https://via.placeholder.com/150" alt="Gráfico Vendas">
                    <h3>Vendas</h3>
                    <p>120</p>
                </div>
                <div class="stat-card">
                    <img src="https://via.placeholder.com/150" alt="Gráfico Clientes">
                    <h3>Clientes</h3>
                    <p>45</p>
                </div>
                <div class="stat-card">
                    <img src="https://via.placeholder.com/150" alt="Gráfico Ticket">
                    <h3>Ticket Médio</h3>
                    <p>R$ 80,00</p>
                </div>
            </div>
        </main>
        
        <footer class="rodape">
            <p>&copy; 2026 - Desenvolvido para a atividade da Aula 07 e 08.</p>
        </footer>
    </div>
</body>
</html>
