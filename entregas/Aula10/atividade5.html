<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de pontos da turma - Aula 10</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/atividade5.js" defer></script>
</head>
<body>
    <main>
        <nav><a href="index.html">Voltar para a Aula 10</a></nav>
        <h1>Pontuação da turma</h1>
        <section>
            <p id="pontos" aria-live="polite">0</p>
            <button type="button" id="acertou">Acertou: +10 pontos</button>
            <button type="button" id="perdeu">Perdeu: −5 pontos</button>
            <button type="button" id="reiniciar">Reiniciar</button>
            <p id="mensagem" aria-live="polite">Continue tentando!</p>
        </section>
    </main>
</body>
</html>
