<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de material escolar - Aula 10</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/atividade3.js" defer></script>
</head>
<body>
    <main>
        <nav><a href="index.html">Voltar para a Aula 10</a></nav>
        <h1>Calculadora de material escolar</h1>
        <section>
            <p>Cada caderno custa R$ 15,00.</p>
            <label for="quantidade">Quantidade de cadernos:</label>
            <input type="number" id="quantidade" min="1" step="1">
            <button type="button" id="calcular">Calcular compra</button>
            <p id="total" aria-live="polite"></p>
        </section>
    </main>
