<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}.hdr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#0f172a;border-bottom:1px solid #1e293b;z-index:10}.hdr h1{font-size:13px;font-weight:600;color:#94a3b8}.dots{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#334155;cursor:pointer;transition:background .2s}.dot.active{background:#3b82f6}.slide-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 40px}.slide{display:none;max-width:880px;width:100%}.slide.active{display:block;animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;font-weight:600;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.slide h2{font-size:28px;font-weight:700;margin-bottom:18px;color:#f1f5f9}.slide p{font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px}.card h3{font-size:14px;color:#93c5fd;margin-bottom:6px}.card p{font-size:13px;color:#94a3b8;margin:0}.code-wrap{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;margin-top:14px;overflow-x:auto;white-space:pre}.k{color:#93C5FD}.a{color:#FDE68A}.s{color:#FDA4AF}.t{color:#E2E8F0}.c{color:#64748b;font-style:italic}.fn{color:#5EEAD4}.hl{background:#1e3a5f;border-left:3px solid #3b82f6;padding:10px 16px;border-radius:6px;font-size:13px;color:#bfdbfe;margin-top:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.compare .col{background:#1e293b;border-radius:10px;padding:14px 16px;border:1px solid #334155}.compare .col h4{font-size:12px;color:#60a5fa;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}.tag-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tag{background:#1e293b;border:1px solid #334155;color:#93c5fd;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s}.tag:hover{background:#334155}.tag-desc{margin-top:10px;font-size:13px;color:#94a3b8;min-height:18px}.quiz-block{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;margin-top:14px}.quiz-block p{color:#e2e8f0;font-weight:600;margin-bottom:10px}.qopt{display:block;width:100%;text-align:left;background:#0f172a;border:1px solid #334155;color:#cbd5e1;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;font-family:inherit}.qopt:hover{background:#1e293b}.qopt.correct{background:#052e1a;border-color:#16a34a;color:#4ade80}.qopt.wrong{background:#450a0a;border-color:#dc2626;color:#f87171}.qfb{font-size:12px;margin-top:6px;color:#94a3b8}.reflect-list{list-style:none;margin-top:14px}.reflect-list li{padding:9px 0;border-bottom:1px solid #1e293b;font-size:14px;color:#cbd5e1}.reflect-list li:before{content:"→ ";color:#60a5fa;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#0f172a;border-top:1px solid #1e293b;z-index:10}.navbtn{font-size:12px;font-weight:600;color:#93c5fd;background:#1e293b;border:1px solid #334155;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}.navbtn:hover{background:#334155}.navbtn:disabled{opacity:.3;pointer-events:none}.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#60a5fa;background:#1e3a5f;border:1px solid #1e40af;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}.autoria-badge:hover{background:#1e40af}</style></head>
<body>
<div class="hdr"><h1>Aula 13 — fetch e Consumo de API</h1><div class="dots" id="dots"></div><a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></div>
<div class="slide-wrap" id="slide-wrap"></div>
<div class="nav"><button class="navbtn" id="prev" onclick="goTo(cur-1)">&#8592; Anterior</button><span style="font-size:12px;color:#64748b" id="counter"></span><button class="navbtn" id="next" onclick="goTo(cur+1)">Próximo &#8594;</button><a href="a13_demo_ao_vivo.html" class="navbtn" style="text-decoration:none;background:#1d4ed8;color:#fff;border-color:#1d4ed8">Ir para Demo &#8594;</a></div>
<script>
const SLIDES = [
{title:"O pedido que você não fica esperando parado", eyebrow:"Analogia", body:`<p>Você já fez o pedido ao garçom e ficou andando pelo restaurante, sem travar no lugar até o prato chegar? É assim que o JavaScript lida com operações demoradas, como buscar dados na internet.</p><div class="cards"><div class="card"><h3>🍽️ fetch()</h3><p>Fazer o pedido — dispara a requisição sem travar a página.</p></div><div class="card"><h3>🎟️ Promise</h3><p>A comanda numerada — uma promessa de resultado futuro.</p></div><div class="card"><h3>⏳ await</h3><p>Esperar sentado(a) — só aquela função pausa, não a página inteira.</p></div><div class="card"><h3>🔗 async</h3><p>Obrigatório em qualquer função que use await dentro dela.</p></div></div>`},
{title:"Síncrono vs. assíncrono", eyebrow:"Conceito", body:`<p>A diferença entre travar tudo e continuar funcionando enquanto espera.</p><div class="compare"><div class="col"><h4>Síncrono</h4><p style="font-size:13px;color:#cbd5e1">Linha 2 só começa depois que a linha 1 termina totalmente. Se a linha 1 demora, tudo trava.</p></div><div class="col"><h4>Assíncrono</h4><p style="font-size:13px;color:#cbd5e1">Linha 1 dispara e a linha 2 já roda. Quando a linha 1 terminar, um código "de volta" é chamado.</p></div></div><div class="hl">💡 Buscar dados pela internet pode demorar — por isso é assíncrono, para não congelar a página inteira.</div>`},
{title:"fetch() na prática", eyebrow:"Sintaxe", body:`<p><code class="fn">fetch()</code> dispara a requisição e retorna uma <strong>Promise</strong>.</p><div class="code-wrap"><span class="fn">fetch</span>(<span class="s">'https://jsonplaceholder.typicode.com/users'</span>)\n  .<span class="fn">then</span>(resposta <span class="k">=></span> resposta.<span class="fn">json</span>())\n  .<span class="fn">then</span>(dados <span class="k">=></span> console.<span class="fn">log</span>(dados))\n  .<span class="fn">catch</span>(erro <span class="k">=></span> console.<span class="fn">error</span>(erro));</div>`},
{title:"Os 3 estados de uma Promise", eyebrow:"Conceito", body:`<p>Toda Promise passa por até 3 estados possíveis:</p><div class="tag-grid" id="tags"></div><div class="tag-desc" id="tag-desc">Clique em um estado para ver a explicação.</div>`},
{title:"async/await — mais legível", eyebrow:"Sintaxe", body:`<p>A mesma ideia de <code class="fn">.then()</code>, só que escrita de um jeito mais parecido com código síncrono.</p><div class="code-wrap"><span class="k">async function</span> <span class="fn">buscarUsuarios</span>() {\n  <span class="k">try</span> {\n    <span class="k">const</span> resposta = <span class="k">await</span> <span class="fn">fetch</span>(<span class="s">'.../users'</span>);\n    <span class="k">const</span> dados = <span class="k">await</span> resposta.<span class="fn">json</span>();\n    console.<span class="fn">log</span>(dados);\n  } <span class="k">catch</span> (erro) {\n    console.<span class="fn">error</span>(<span class="s">'Deu erro:'</span>, erro);\n  }\n}</div>`},
{title:"Exibindo dados reais na tela", eyebrow:"Prática", body:`<p>Juntando tudo: requisição HTTP + DOM (Aula 10) = dados dinâmicos na página.</p><div class="code-wrap"><span class="k">async function</span> <span class="fn">mostrarUsuarios</span>() {\n  <span class="k">const</span> resposta = <span class="k">await</span> <span class="fn">fetch</span>(<span class="s">'.../users'</span>);\n  <span class="k">const</span> usuarios = <span class="k">await</span> resposta.<span class="fn">json</span>();\n\n  <span class="k">const</span> lista = document.<span class="fn">getElementById</span>(<span class="s">'lista'</span>);\n  lista.innerHTML = usuarios\n    .<span class="fn">map</span>(u <span class="k">=></span> <span class="s">\`&lt;li&gt;\${u.name}&lt;/li&gt;\`</span>)\n    .<span class="fn">join</span>(<span class="s">''</span>);\n}</div>`},
{title:"Verificando o entendimento", eyebrow:"Quiz rápido", body:`<div class="quiz-block" id="q1"><p>1. O que fetch() retorna?</p></div><div class="quiz-block" id="q2" style="margin-top:10px"><p>2. Para que serve await?</p></div>`},
{title:"O que vem a seguir", eyebrow:"Fechamento", body:`<ul class="reflect-list"><li>fetch() faz requisições sem travar a página.</li><li>Promises têm 3 estados: pending, fulfilled, rejected.</li><li>async/await deixa o código assíncrono mais legível.</li><li>Próxima aula: e quando a requisição falha? Tratamento de erros — checkpoint 4!</li></ul>`}
];
let cur=0;
function buildDots(){document.getElementById('dots').innerHTML=SLIDES.map((_,i)=>`<div class="dot" onclick="goTo(${i})" id="d${i}"></div>`).join('');}
function buildSlides(){document.getElementById('slide-wrap').innerHTML=SLIDES.map((s,i)=>`<div class="slide" id="s${i}"><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}</div>`).join('');}
function goTo(i){if(i<0||i>=SLIDES.length)return;cur=i;document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));document.getElementById(`s${i}`).classList.add('active');document.getElementById(`d${i}`).classList.add('active');document.getElementById('counter').textContent=`${i+1} / ${SLIDES.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===SLIDES.length-1;if(i===3)buildTags();if(i===6)buildQuiz();}
function buildTags(){const el=document.getElementById('tags');if(!el||el.dataset.built)return;el.dataset.built='1';const tags=[['pending','Ainda não terminou — o pedido está sendo preparado.'],['fulfilled','Terminou com sucesso — o prato chegou.'],['rejected','Terminou com erro — faltou ingrediente.']];el.innerHTML=tags.map(t=>`<span class="tag" onclick="showTag('${t[0]}','${t[1].replace(/'/g,"\\'")}')">${t[0]}</span>`).join('');}
function showTag(tag,desc){document.getElementById('tag-desc').textContent=`${tag}: ${desc}`;}
function buildQuiz(){const q1=document.getElementById('q1');if(!q1.dataset.built){q1.dataset.built='1';const opts=[['Um array de dados',false],['Uma Promise',true],['Um número',false]];q1.innerHTML+=opts.map(o=>`<button class="qopt" onclick="answer(this,${o[1]},'fb1')">${o[0]}</button>`).join('')+`<div class="qfb" id="fb1"></div>`;}const q2=document.getElementById('q2');if(!q2.dataset.built){q2.dataset.built='1';const opts=[['Pausa só aquela função até a Promise resolver',true],['Trava a página inteira',false],['Cancela a requisição',false]];q2.innerHTML+=opts.map(o=>`<button class="qopt" onclick="answer(this,${o[1]},'fb2')">${o[0]}</button>`).join('')+`<div class="qfb" id="fb2"></div>`;}}
function answer(el,correct,fbId){const parent=el.parentElement;parent.querySelectorAll('.qopt').forEach(b=>b.style.pointerEvents='none');el.classList.add(correct?'correct':'wrong');document.getElementById(fbId).textContent=correct?'✓ Correto!':'✗ Não é isso — revise o conceito.';}
buildDots();buildSlides();goTo(0);
</script>
