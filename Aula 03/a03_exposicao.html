<head>
<meta charset="UTF-8">

<title>Exposição Dialogada — HTML Semântico, Formulários e Multimídia · Aula 03</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#1e293b;background:#f8fafc;overflow:hidden}

#app{display:flex;flex-direction:column;height:100vh;padding-bottom:52px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;flex-wrap:wrap;gap:8px}
.hdr-left{display:flex;align-items:center;gap:12px}
.badge{background:#1d4ed8;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.hdr-title{font-size:14px;font-weight:600;color:#1e293b}
.hdr-sub{font-size:12px;color:#94a3b8;margin-top:1px}
.timer{font-size:13px;font-weight:500;color:#64748b;background:#f1f5f9;padding:5px 14px;border-radius:8px;border:1px solid #e2e8f0;min-width:64px;text-align:center;font-family:'Courier New',monospace}
.timer.warn{color:#d97706;background:#fffbeb;border-color:#fcd34d}
.timer.danger{color:#dc2626;background:#fef2f2;border-color:#fca5a5}

/* PROGRESS DOTS */
.dots{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:all .2s;flex-shrink:0}
.dot.active{background:#1d4ed8;transform:scale(1.45)}
.dot.done{background:#93c5fd;opacity:.6}
.dot-sep{width:12px;height:1px;background:#e2e8f0;flex-shrink:0}

/* SLIDE AREA */
.slide-wrap{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;padding:24px 28px;overflow-y:auto;display:none}
.slide.active{display:block;animation:sIn .25s ease}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* TYPOGRAPHY */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.slide-title{font-size:22px;font-weight:600;color:#1e293b;line-height:1.2;margin-bottom:6px}
.slide-sub{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:18px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px}
.card.accent{border-left:3px solid #1d4ed8}
.card-icon{font-size:20px;margin-bottom:6px}
.card-title{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:4px}
.card-body{font-size:12px;color:#64748b;line-height:1.55}
.card-body em{font-style:italic}
.card-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* TIMELINE */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1.5px;background:#e2e8f0}
.tl-item{position:relative;margin-bottom:14px;cursor:pointer}
.tl-item::before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid #e2e8f0;background:#fff;transition:all .2s}
.tl-item:hover::before{background:#3b82f6;border-color:#3b82f6}
.tl-item.tl-open::before{background:#1d4ed8;border-color:#1d4ed8;transform:scale(1.25)}
.tl-year{font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:2px}
.tl-head{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:3px}
.tl-desc{font-size:12px;color:#64748b;line-height:1.55;max-height:0;overflow:hidden;transition:max-height .3s ease}
.tl-item.tl-open .tl-desc{max-height:160px}
.tl-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:5px}

/* CODE */
.code-wrap{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin:10px 0}
.code-hdr{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:7px 14px;border-bottom:1px solid #e2e8f0}
.code-lang{font-size:11px;font-weight:500;color:#64748b}
.cdots{display:flex;gap:5px}
.cdot{width:10px;height:10px;border-radius:50%}
pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;font-size:12px;line-height:1.75;overflow-x:auto;font-family:'Courier New',monospace;white-space:pre}
.k{color:#93c5fd}.kv{color:#6ee7b7}.a{color:#fde68a}.s{color:#fda4af}.t{color:#e2e8f0}.c{color:#475569;font-style:italic}

/* COMPARE */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:560px){.compare{grid-template-columns:1fr}}
.comp-side{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.comp-hdr{padding:8px 14px;font-size:12px;font-weight:600}
.comp-body{padding:10px 14px;font-size:12px;color:#64748b;line-height:1.65}
.comp-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* TAG EXPLORER */
.tag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
@media(max-width:500px){.tag-grid{grid-template-columns:1fr 1fr}}
.tag-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.tag-item:hover{border-color:#93c5fd;background:#eff6ff}
.tag-item.tag-on{border-color:#1d4ed8;background:#eff6ff}
.tag-code{font-size:12px;font-weight:600;color:#1d4ed8;font-family:'Courier New',monospace;margin-bottom:3px}
.tag-name{font-size:11px;color:#94a3b8}
.tag-preview{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;min-height:56px;font-size:13px;color:#64748b;line-height:1.6}
.tag-preview strong{color:#1e293b;font-weight:600;font-family:'Courier New',monospace}

/* QUIZ */
.quiz-q{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:12px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e293b;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.quiz-opt:hover:not(.correct):not(.wrong):not(.dimmed){border-color:#93c5fd;background:#eff6ff}
.quiz-opt.correct{background:#f0fdf4;border-color:#86efac;color:#15803d;pointer-events:none}
.quiz-opt.wrong{background:#fef2f2;border-color:#fca5a5;color:#dc2626;pointer-events:none}
.quiz-opt.dimmed{opacity:.4;pointer-events:none}
.quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-block{margin-bottom:18px}

/* REFLECT */
.reflect-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.reflect-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px}
.reflect-num{width:24px;height:24px;min-width:24px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.reflect-text{font-size:13px;color:#64748b;line-height:1.55}
.reflect-text strong{color:#1e293b;font-weight:600}

/* HIGHLIGHT BOX */
.hl{background:#fffbeb;border-left:3px solid #f59e0b;padding:10px 14px;font-size:13px;color:#78350f;line-height:1.55;margin:10px 0}
.hl strong{color:#92400e;font-weight:600}

/* NAV BAR */
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.nav-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:7px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:#e2e8f0;color:#1e293b}
.nav-btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.nav-btn.primary:hover{background:#1e40af}
.nav-btn:disabled{opacity:.35;pointer-events:none}
.nav-counter{font-size:12px;color:#94a3b8}

code{font-family:'Courier New',monospace;font-size:12px;background:#f1f5f9;padding:1px 5px;border-radius:3px;border:1px solid #e2e8f0}

/* ── Autoria @karizeviecelli ── */
.autoria-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:#2563eb;
  background:#eff6ff;border:1px solid #bfdbfe;
  padding:2px 9px;border-radius:20px;text-decoration:none;
  font-family:'Courier New',monospace;letter-spacing:.02em;white-space:nowrap;
}
.autoria-badge:hover{background:#bfdbfe;color:#1e40af}
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <span class="badge">Aula 03</span>
      <div>
        <div class="hdr-title">HTML Semântico, Formulários e Multimídia — Exposição Dialogada</div>
        <div class="hdr-sub">30 minutos · Projetor · Turma</div>
      </div>
    </div>
    <a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a>
    <div class="timer" id="timer">30:00</div>
  <button onclick="window.location.href='a03_demo_ao_vivo.html'" style="font-size:12px;font-weight:600;background:#fff;border:1.5px solid #1d4ed8;color:#1d4ed8;padding:5px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='#fff'">💻 Demo ao Vivo →</button>
  </div>

  <div class="dots" id="dots-bar"></div>

  <div class="slide-wrap" id="slide-wrap"></div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="nav(-1)" disabled>← Anterior</button>
    <span class="nav-counter" id="counter">1 / 9</span>
    <button class="nav-btn primary" id="btn-next" onclick="nav(1)">Próximo →</button>
  </div>
</div>

<script>
const SLIDES = [
  {
    id:'intro', time:3,
    render:()=>`
      <div class="eyebrow">Abertura · 3 minutos</div>
      <div class="slide-title">Colocando placas nas portas da casa</div>
      <div class="slide-sub">Na Aula 02 construímos a obra bruta: paredes, cômodos, portas. Só que, até agora, nenhum cômodo tem placa dizendo o que ele é. Hoje colocamos as placas.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">🚪</div>
          <div class="card-title">Cômodos sem identificação</div>
          <div class="card-body">Para o navegador, tudo até agora era uma "sala genérica". Hoje aprendemos a dizer: isto é o cabeçalho, isto é a navegação, isto é o rodapé.</div>
        </div>
        <div class="card accent">
          <div class="card-icon">📋</div>
          <div class="card-title">Fichas de atendimento</div>
          <div class="card-body">Também vamos aprender a criar formulários — as "fichas" que coletam informações de quem visita a página.</div>
        </div>
        <div class="card">
          <div class="card-icon">💬</div>
          <div class="card-title">Pergunta para a turma</div>
          <div class="card-body"><em>"Já preencheram algum formulário de cadastro online hoje? O que tinha nele?"</em><br>Vamos construir um parecido.</div>
        </div>
        <div class="card">
          <div class="card-icon">🎯</div>
          <div class="card-title">O que veremos hoje</div>
          <div class="card-body">Tags semânticas, tabelas, formulários completos e como incorporar vídeo, áudio e conteúdo externo.</div>
        </div>
      </div>`
  },
  {
    id:'semantica', time:6,
    render:()=>`
      <div class="eyebrow">As placas da casa · 6 minutos</div>
      <div class="slide-title">Tags semânticas — uma placa para cada cômodo</div>
      <div class="slide-sub">Clique em cada tag para ver a analogia e o papel dela.</div>
      <div class="timeline" id="tl">
        <div class="tl-item" onclick="tlClick(0)">
          <div class="tl-year">&lt;header&gt;</div>
          <div class="tl-head">A fachada e a entrada</div>
          <div class="tl-desc">Cabeçalho da página ou de uma seção. Geralmente contém logo, título e navegação.<br><span class="tl-tag" style="background:#eff6ff;color:#1d4ed8">entrada</span></div>
        </div>
        <div class="tl-item" onclick="tlClick(1)">
          <div class="tl-year">&lt;nav&gt;</div>
          <div class="tl-head">O corredor de acesso</div>
          <div class="tl-desc">Bloco de navegação principal, com links para outras partes do site ou da página.<br><span class="tl-tag" style="background:#f0fdf4;color:#15803d">navegação</span></div>
        </div>
        <div class="tl-item" onclick="tlClick(2)">
          <div class="tl-year">&lt;main&gt;</div>
          <div class="tl-head">A sala principal</div>
          <div class="tl-desc">Conteúdo principal e único da página — só deve existir um por documento.<br><span class="tl-tag" style="background:#fffbeb;color:#92400e">conteúdo central</span></div>
        </div>
        <div class="tl-item" onclick="tlClick(3)">
          <div class="tl-year">&lt;section&gt;</div>
          <div class="tl-head">Cômodos dentro da sala</div>
          <div class="tl-desc">Agrupa conteúdo relacionado que forma uma seção temática — deve ter um título (h2, h3).<br><span class="tl-tag" style="background:#ede9fe;color:#5b21b6">seção temática</span></div>
        </div>
        <div class="tl-item" onclick="tlClick(4)">
          <div class="tl-year">&lt;article&gt;</div>
          <div class="tl-head">Um quadro autônomo na parede</div>
          <div class="tl-desc">Conteúdo independente, que faria sentido mesmo publicado sozinho em outro lugar.<br><span class="tl-tag" style="background:#fef2f2;color:#991b1b">independente</span></div>
        </div>
        <div class="tl-item" onclick="tlClick(5)">
          <div class="tl-year">&lt;aside&gt;</div>
          <div class="tl-head">O anexo lateral</div>
          <div class="tl-desc">Conteúdo relacionado, mas secundário — como uma barra lateral ou uma curiosidade.<br><span class="tl-tag" style="background:#ccfbf1;color:#0f766e">secundário</span></div>
        </div>
        <div class="tl-item" onclick="tlClick(6)">
          <div class="tl-year">&lt;footer&gt;</div>
          <div class="tl-head">O quintal dos fundos</div>
          <div class="tl-desc">Rodapé de uma página ou seção. Contém copyright, contatos, links de serviço.<br><span class="tl-tag" style="background:#eff6ff;color:#1d4ed8">encerramento</span></div>
        </div>
      </div>`
  },
  {
    id:'divsemantica', time:3,
    render:()=>`
      <div class="eyebrow">Conceito central · 3 minutos</div>
      <div class="slide-title">Por que não usar só &lt;div&gt; para tudo?</div>
      <div class="slide-sub">Tecnicamente funciona. Mas perde-se um significado importante.</div>
      <div class="compare">
        <div class="comp-side">
          <div class="comp-hdr" style="background:#fef2f2;color:#dc2626">Só com &lt;div&gt;</div>
          <div class="comp-body">Uma "caixa sem etiqueta". O navegador, o Google e os leitores de tela não sabem o que é aquele bloco.<br><br>
            Resultado:<br>
            • Pior para acessibilidade<br>
            • Pior para SEO (buscadores)<br>
            • Código mais difícil de entender</div>
        </div>
        <div class="comp-side">
          <div class="comp-hdr" style="background:#f0fdf4;color:#15803d">Com tags semânticas</div>
          <div class="comp-body">Cada bloco tem uma "etiqueta" que descreve seu papel.<br><br>
            Resultado:<br>
            • Leitores de tela anunciam corretamente cada região<br>
            • Buscadores entendem a estrutura da página<br>
            • Qualquer desenvolvedor lê o código mais rápido</div>
        </div>
      </div>
      <div class="hl"><strong>Analogia:</strong> é a diferença entre uma casa com placas "Cozinha", "Quarto", "Sala" e uma casa onde todas as portas dizem apenas "Sala 1", "Sala 2", "Sala 3".</div>`
  },
  {
    id:'formulario', time:5,
    render:()=>`
      <div class="eyebrow">Código na prática · 5 minutos</div>
      <div class="slide-title">Formulário: a ficha de atendimento da recepção</div>
      <div class="slide-sub">Cada campo é uma pergunta na ficha. Vamos entender as peças.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">HTML5 · Formulário de contato</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">&lt;form</span> <span class="a">action</span>=<span class="s">"/enviar"</span> <span class="a">method</span>=<span class="s">"POST"</span><span class="k">&gt;</span>
  <span class="c">&lt;!-- action = para onde vai. method = como vai --&gt;</span>

  <span class="k">&lt;label</span> <span class="a">for</span>=<span class="s">"nome"</span><span class="k">&gt;</span><span class="t">Nome:</span><span class="k">&lt;/label&gt;</span>
  <span class="k">&lt;input</span> <span class="a">type</span>=<span class="s">"text"</span> <span class="a">id</span>=<span class="s">"nome"</span> <span class="a">name</span>=<span class="s">"nome"</span> <span class="a">required</span><span class="k">&gt;</span>

  <span class="k">&lt;label</span> <span class="a">for</span>=<span class="s">"assunto"</span><span class="k">&gt;</span><span class="t">Assunto:</span><span class="k">&lt;/label&gt;</span>
  <span class="k">&lt;select</span> <span class="a">id</span>=<span class="s">"assunto"</span> <span class="a">name</span>=<span class="s">"assunto"</span><span class="k">&gt;</span>
    <span class="k">&lt;option&gt;</span><span class="t">Dúvida</span><span class="k">&lt;/option&gt;</span>
  <span class="k">&lt;/select&gt;</span>

  <span class="k">&lt;button</span> <span class="a">type</span>=<span class="s">"submit"</span><span class="k">&gt;</span><span class="t">Enviar</span><span class="k">&lt;/button&gt;</span>
<span class="k">&lt;/form&gt;</span></pre>
      </div>
      <div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:12px">
        <div class="card"><div class="card-title">label + for</div><div class="card-body">Conecta o rótulo ao campo pelo id — essencial para acessibilidade.</div></div>
        <div class="card"><div class="card-title">name</div><div class="card-body">É o "rótulo" que o servidor usa para separar cada informação recebida.</div></div>
        <div class="card"><div class="card-title">required</div><div class="card-body">Impede o envio do formulário se o campo estiver vazio.</div></div>
      </div>`
  },
  {
    id:'tabelasmidia', time:4,
    render:()=>`
      <div class="eyebrow">Código na prática · 4 minutos</div>
      <div class="slide-title">Tabelas e multimídia</div>
      <div class="slide-sub">Duas peças a mais no nosso repertório de hoje.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">HTML5 · Tabela</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">&lt;table&gt;</span>
  <span class="k">&lt;thead&gt;</span>
    <span class="k">&lt;tr&gt;&lt;th&gt;</span><span class="t">Aluno</span><span class="k">&lt;/th&gt;&lt;th&gt;</span><span class="t">Nota</span><span class="k">&lt;/th&gt;&lt;/tr&gt;</span>
  <span class="k">&lt;/thead&gt;</span>
  <span class="k">&lt;tbody&gt;</span>
    <span class="k">&lt;tr&gt;&lt;td&gt;</span><span class="t">Ana</span><span class="k">&lt;/td&gt;&lt;td&gt;</span><span class="t">9.0</span><span class="k">&lt;/td&gt;&lt;/tr&gt;</span>
  <span class="k">&lt;/tbody&gt;</span>
<span class="k">&lt;/table&gt;</span></pre>
      </div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">HTML5 · Multimídia</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">&lt;video</span> <span class="a">src</span>=<span class="s">"apresentacao.mp4"</span> <span class="a">controls</span><span class="k">&gt;&lt;/video&gt;</span>
<span class="k">&lt;audio</span> <span class="a">src</span>=<span class="s">"podcast.mp3"</span> <span class="a">controls</span><span class="k">&gt;&lt;/audio&gt;</span>
<span class="k">&lt;iframe</span> <span class="a">src</span>=<span class="s">"https://maps.google.com/..."</span><span class="k">&gt;&lt;/iframe&gt;</span>
<span class="c">&lt;!-- iframe = uma janela para outra página, dentro da sua --&gt;</span></pre>
      </div>`
  },
  {
    id:'quiz', time:3,
    render:()=>`
      <div class="eyebrow">Verificação de aprendizagem · 3 minutos</div>
      <div class="slide-title">Quiz rápido — turma responde junto</div>
      <div class="slide-sub">Sem pressão. O objetivo é consolidar o que aprendemos.</div>
      <div class="quiz-block">
        <div class="quiz-q">1. Qual a diferença principal entre &lt;section&gt; e &lt;article&gt;?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>A</span>Não há diferença</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb1')"><span>B</span>article é independente; section depende do contexto</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>C</span>article só serve para imagens</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>D</span>section é sempre o rodapé</div>
        </div>
        <div class="quiz-feedback" id="fb1" style="background:#f0fdf4;color:#15803d">Correto! article faz sentido sozinho em outro lugar; section é uma parte temática, geralmente dependente da página.</div>
      </div>
      <div class="quiz-block">
        <div class="quiz-q">2. Por que usar &lt;label for="..."&gt; junto com um &lt;input&gt;?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>A</span>Só deixa mais bonito</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb2')"><span>B</span>Conecta o rótulo ao campo — essencial para acessibilidade</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>C</span>É obrigatório por lei</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>D</span>Só funciona com type="text"</div>
        </div>
        <div class="quiz-feedback" id="fb2" style="background:#f0fdf4;color:#15803d">Correto! O for conecta o rótulo ao input pelo id, ajudando leitores de tela e permitindo clicar no texto para focar o campo.</div>
      </div>`
  },
  {
    id:'curiosidades', time:1,
    render:()=>`
      <div class="eyebrow">Bônus · 1 minuto</div>
      <div class="slide-title">Você sabia?</div>
      <div class="slide-sub">Fatos sobre semântica e formulários que valem compartilhar com a turma.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">🕰️</div>
          <div class="card-title">Tags semânticas são recentes</div>

let cur = 0;
let timerInterval = null;
let timerStarted = false;

function buildDots() {
  const bar = document.getElementById('dots-bar');
  SLIDES.forEach((s, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = 'Slide ' + (i + 1);
    d.onclick = () => goTo(i);
    bar.appendChild(d);
    if (i < SLIDES.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'dot-sep';
      bar.appendChild(sep);
    }
  });
}

function buildSlides() {
  const wrap = document.getElementById('slide-wrap');
  SLIDES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.id = 'sl-' + s.id;
    div.innerHTML = s.render();
    wrap.appendChild(div);
  });
}

function goTo(i) {
  const prev = cur;
  document.getElementById('sl-' + SLIDES[prev].id).classList.remove('active');
  const dots = document.querySelectorAll('.dot');
  dots[prev].classList.remove('active');
  if (i > prev) dots[prev].classList.add('done');

  cur = i;
  const el = document.getElementById('sl-' + SLIDES[cur].id);
  el.innerHTML = SLIDES[cur].render();
  el.classList.add('active');
  dots[cur].classList.add('active');
  dots[cur].classList.remove('done');

  document.getElementById('btn-prev').disabled = cur === 0;
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = cur === SLIDES.length - 1;
  btnNext.textContent = cur === SLIDES.length - 1 ? 'Finalizar' : 'Próximo →';
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + SLIDES.length;

  if (!timerStarted) { timerStarted = true; startTimer(); }
}

function nav(d) {
  const ni = cur + d;
  if (ni >= 0 && ni < SLIDES.length) goTo(ni);
}

function startTimer() {
  let rem = 30 * 60;
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    rem--;
    if (rem <= 0) { clearInterval(timerInterval); el.textContent = '00:00'; el.className = 'timer danger'; return; }
    const m = Math.floor(rem / 60), s = rem % 60;
    el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    if (rem <= 300) el.className = 'timer warn';
    if (rem <= 60)  el.className = 'timer danger';
  }, 1000);
}

function tlClick(i) {
  document.querySelectorAll('.tl-item').forEach((el, j) => el.classList.toggle('tl-open', j === i));
}

function showTag(el, tag, desc) {
  document.querySelectorAll('.tag-item').forEach(t => t.classList.remove('tag-on'));
  el.classList.add('tag-on');
  document.getElementById('tag-prev').innerHTML =
    '<strong>' + tag + '</strong><br>' + desc;
}

function answer(el, type, fbId) {
  const block = el.closest('.quiz-block');
  block.querySelectorAll('.quiz-opt').forEach(o => {
    if (o === el) o.classList.add(type === 'c' ? 'correct' : 'wrong');
    else o.classList.add('dimmed');
  });
  const fb = document.getElementById(fbId);
  if (type !== 'c') {
    fb.style.background = '#fef2f2';
    fb.style.color = '#dc2626';
    fb.textContent = 'Não exatamente — pense no papel semântico de cada tag.';
  }
  fb.style.display = 'block';
}

buildDots();
buildSlides();
document.getElementById('btn-prev').disabled = true;
</script>
