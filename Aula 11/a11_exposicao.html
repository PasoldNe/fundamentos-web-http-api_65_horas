<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados.">
<title>Exposição Dialogada — Conceitos de API REST · Aula 11</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#1e293b;background:#f8fafc;overflow:hidden}

#app{display:flex;flex-direction:column;height:100vh;padding-bottom:52px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;flex-wrap:wrap;gap:8px}
.hdr-left{display:flex;align-items:center;gap:12px}
.badge{background:#1d4ed8;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.hdr-title{font-size:14px;font-weight:600;color:#1e293b}
.hdr-sub{font-size:12px;color:#94a3b8;margin-top:1px}
.timer{font-size:13px;font-weight:500;color:#64748b;background:#f1f5f9;padding:5px 14px;border-radius:8px;border:1px solid #e2e8f0;min-width:64px;text-align:center;font-family:'Courier New',monospace}
.timer.warn{color:#d97706;background:#fffbeb;border-color:#fcd34d}
.timer.danger{color:#dc2626;background:#fef2f2;border-color:#fca5a5}

/* PROGRESS DOTS */
.dots{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:all .2s;flex-shrink:0}
.dot.active{background:#1d4ed8;transform:scale(1.45)}
.dot.done{background:#93c5fd;opacity:.6}
.dot-sep{width:12px;height:1px;background:#e2e8f0;flex-shrink:0}

/* SLIDE AREA */
.slide-wrap{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;padding:24px 28px;overflow-y:auto;display:none}
.slide.active{display:block;animation:sIn .25s ease}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* TYPOGRAPHY */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.slide-title{font-size:22px;font-weight:600;color:#1e293b;line-height:1.2;margin-bottom:6px}
.slide-sub{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:18px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px}
.card.accent{border-left:3px solid #1d4ed8}
.card-icon{font-size:20px;margin-bottom:6px}
.card-title{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:4px}
.card-body{font-size:12px;color:#64748b;line-height:1.55}
.card-body em{font-style:italic}
.card-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* CODE */
.code-wrap{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin:10px 0}
.code-hdr{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:7px 14px;border-bottom:1px solid #e2e8f0}
.code-lang{font-size:11px;font-weight:500;color:#64748b}
.cdots{display:flex;gap:5px}
.cdot{width:10px;height:10px;border-radius:50%}
pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;font-size:12px;line-height:1.75;overflow-x:auto;font-family:'Courier New',monospace;white-space:pre}
.k{color:#93c5fd}.kv{color:#6ee7b7}.a{color:#fde68a}.s{color:#fda4af}.t{color:#e2e8f0}.c{color:#475569;font-style:italic}.fn{color:#c4b5fd}

/* COMPARE */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:560px){.compare{grid-template-columns:1fr}}
.comp-side{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.comp-hdr{padding:8px 14px;font-size:12px;font-weight:600}
.comp-body{padding:10px 14px;font-size:12px;color:#64748b;line-height:1.65}
.comp-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* TAG EXPLORER */
.tag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
@media(max-width:500px){.tag-grid{grid-template-columns:1fr 1fr}}
.tag-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.tag-item:hover{border-color:#93c5fd;background:#eff6ff}
.tag-item.tag-on{border-color:#1d4ed8;background:#eff6ff}
.tag-code{font-size:12px;font-weight:600;color:#1d4ed8;font-family:'Courier New',monospace;margin-bottom:3px}
.tag-name{font-size:11px;color:#94a3b8}
.tag-preview{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;min-height:56px;font-size:13px;color:#64748b;line-height:1.6}
.tag-preview strong{color:#1e293b;font-weight:600;font-family:'Courier New',monospace}

/* JSON TREE */
.json-box{background:#1e293b;border-radius:10px;padding:14px 16px;font-family:'Courier New',monospace;font-size:12px;line-height:1.8;color:#e2e8f0;margin:10px 0;overflow-x:auto}
.jk{color:#93c5fd}.jv-s{color:#fda4af}.jv-n{color:#6ee7b7}.jv-b{color:#fde68a}.jp{color:#e2e8f0}

/* QUIZ */
.quiz-q{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:12px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e293b;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.quiz-opt:hover:not(.correct):not(.wrong):not(.dimmed){border-color:#93c5fd;background:#eff6ff}
.quiz-opt.correct{background:#f0fdf4;border-color:#86efac;color:#15803d;pointer-events:none}
.quiz-opt.wrong{background:#fef2f2;border-color:#fca5a5;color:#dc2626;pointer-events:none}
.quiz-opt.dimmed{opacity:.4;pointer-events:none}
.quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-block{margin-bottom:18px}

/* REFLECT */
.reflect-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.reflect-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px}
.reflect-num{width:24px;height:24px;min-width:24px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.reflect-text{font-size:13px;color:#64748b;line-height:1.55}
.reflect-text strong{color:#1e293b;font-weight:600}

/* HIGHLIGHT BOX */
.hl{background:#fffbeb;border-left:3px solid #f59e0b;padding:10px 14px;font-size:13px;color:#78350f;line-height:1.55;margin:10px 0}
.hl strong{color:#92400e;font-weight:600}

/* NAV BAR */
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.nav-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:7px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:#e2e8f0;color:#1e293b}
.nav-btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.nav-btn.primary:hover{background:#1e40af}
.nav-btn:disabled{opacity:.35;pointer-events:none}
.nav-counter{font-size:12px;color:#94a3b8}

code{font-family:'Courier New',monospace;font-size:12px;background:#f1f5f9;padding:1px 5px;border-radius:3px;border:1px solid #e2e8f0}

/* ── Autoria @karizeviecelli ── */
.autoria-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:#2563eb;
  background:#eff6ff;border:1px solid #bfdbfe;
  padding:2px 9px;border-radius:20px;text-decoration:none;
  font-family:'Courier New',monospace;letter-spacing:.02em;white-space:nowrap;
}
.autoria-badge:hover{background:#bfdbfe;color:#1e40af}
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <span class="badge">Aula 11</span>
      <div>
        <div class="hdr-title">Conceitos de API REST — Exposição Dialogada</div>
        <div class="hdr-sub">30 minutos · Projetor · Turma</div>
      </div>
    </div>
    <a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a>
    <div class="timer" id="timer">30:00</div>
  <button onclick="window.location.href='a11_demo_ao_vivo.html'" style="font-size:12px;font-weight:600;background:#fff;border:1.5px solid #1d4ed8;color:#1d4ed8;padding:5px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='#fff'">💻 Demo ao Vivo →</button>
  </div>

  <div class="dots" id="dots-bar"></div>

  <div class="slide-wrap" id="slide-wrap"></div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="nav(-1)" disabled>← Anterior</button>
    <span class="nav-counter" id="counter">1 / 9</span>
    <button class="nav-btn primary" id="btn-next" onclick="nav(1)">Próximo →</button>
  </div>
</div>

<script>
const SLIDES = [
  {
    id:'intro', time:3,
    render:()=>`
      <div class="eyebrow">Abertura · 3 minutos</div>
      <div class="slide-title">O cérebro da casa liga para o restaurante</div>
      <div class="slide-sub">Lembram do garçom e do cardápio da Aula 1? Agora é o cérebro da casa quem faz o pedido, sozinho, para buscar dados de fora.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">🍽️</div>
          <div class="card-title">API = o restaurante</div>
          <div class="card-body">Um sistema pronto para receber pedidos e devolver respostas.</div>
        </div>
        <div class="card accent">
          <div class="card-icon">📋</div>
          <div class="card-title">Recurso = prato do cardápio</div>
          <div class="card-body">"usuários", "produtos" — algo que existe e pode ser consultado.</div>
        </div>
        <div class="card">
          <div class="card-icon">📍</div>
          <div class="card-title">Endpoint = endereço do prato</div>
          <div class="card-body">A URL exata: /usuarios, /produtos/42.</div>
        </div>
        <div class="card">
          <div class="card-icon">📝</div>
          <div class="card-title">JSON = a comanda</div>
          <div class="card-body">O formato universal que qualquer sistema entende.</div>
        </div>
      </div>
      <div class="hl"><strong>Pergunta para a turma:</strong> Um app de previsão do tempo não "sabe" o clima sozinho — ele pergunta para uma API externa. Que outros apps vocês acham que "pedem emprestado" dados assim?</div>`
  },
  {
    id:'oquee', time:5,
    render:()=>`
      <div class="eyebrow">Fundação · 5 minutos</div>
      <div class="slide-title">O que é uma API REST</div>
      <div class="slide-sub">Um "menu de opções" que um sistema oferece para outros sistemas conversarem com ele.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">Conceito</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="t">API</span> <span class="t">=</span> <span class="s">Application Programming Interface</span>

<span class="t">REST</span> <span class="t">=</span> <span class="s">estilo de organizar APIs, baseado em:</span>
  <span class="c">- Recursos identificados por URLs (endpoints)</span>
  <span class="c">- Verbos HTTP indicando a ação desejada</span>
  <span class="c">- Respostas normalmente em JSON</span></pre>
      </div>`
  },
  {
    id:'endpoints', time:6,
    render:()=>`
      <div class="eyebrow">Recursos e endpoints · 6 minutos</div>
      <div class="slide-title">O mesmo endereço, ações diferentes</div>
      <div class="slide-sub">O endpoint base se repete; é o verbo HTTP que muda o significado.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">Recurso: usuários</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">GET</span>    <span class="t">/usuarios</span>       <span class="c">→ lista todos os usuários</span>
<span class="k">GET</span>    <span class="t">/usuarios/42</span>    <span class="c">→ detalhes do usuário 42</span>
<span class="k">POST</span>   <span class="t">/usuarios</span>       <span class="c">→ cria um novo usuário</span>
<span class="k">PUT</span>    <span class="t">/usuarios/42</span>    <span class="c">→ atualiza o usuário 42</span>
<span class="k">DELETE</span> <span class="t">/usuarios/42</span>    <span class="c">→ remove o usuário 42</span></pre>
      </div>
      <div class="hl"><strong>Coração do REST:</strong> URLs representam "coisas" (substantivos). Verbos HTTP representam "ações" (verbos).</div>`
  },
  {
    id:'verbos', time:5,
    render:()=>`
      <div class="eyebrow">Explorando os verbos · 5 minutos</div>
      <div class="slide-title">Verbos HTTP — clique para relembrar</div>
      <div class="slide-sub">A mesma tabela que vimos na Aula 1, agora aplicada a uma API real.</div>
      <div class="tag-grid">
        <div class="tag-item" onclick="showTag(this,'GET','Buscar dados — não deveria alterar nada no servidor. Ex.: listar usuários.')">
          <div class="tag-code">GET</div><div class="tag-name">Buscar</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'POST','Criar um novo recurso. Ex.: cadastrar um novo usuário.')">
          <div class="tag-code">POST</div><div class="tag-name">Criar</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'PUT','Atualizar um recurso existente POR COMPLETO. Ex.: substituir todos os dados de um usuário.')">
          <div class="tag-code">PUT</div><div class="tag-name">Atualizar tudo</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'PATCH','Atualizar um recurso PARCIALMENTE. Ex.: mudar só o e-mail, sem tocar no resto.')">
          <div class="tag-code">PATCH</div><div class="tag-name">Atualizar parte</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'DELETE','Remover um recurso existente. Ex.: excluir um usuário.')">
          <div class="tag-code">DELETE</div><div class="tag-name">Remover</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'Regra de ouro','GET nunca deveria alterar dados no servidor — quebrar essa expectativa é considerado um erro de design da API.')">
          <div class="tag-code">⚠️ regra</div><div class="tag-name">GET é só leitura</div>
        </div>
      </div>
      <div class="tag-preview" id="tag-prev">Clique em um verbo acima para ver a descrição aqui.</div>`
  },
  {
    id:'json', time:6,
    render:()=>`
      <div class="eyebrow">A comanda · 6 minutos</div>
      <div class="slide-title">O formato JSON</div>
      <div class="slide-sub">Um formato de texto para dados estruturados, leve e fácil de ler por humanos e máquinas.</div>
      <div class="json-box"><span class="jp">{</span>
  <span class="jk">"id"</span><span class="jp">:</span> <span class="jv-n">42</span><span class="jp">,</span>
  <span class="jk">"nome"</span><span class="jp">:</span> <span class="jv-s">"Maria Silva"</span><span class="jp">,</span>
  <span class="jk">"ativo"</span><span class="jp">:</span> <span class="jv-b">true</span><span class="jp">,</span>
  <span class="jk">"tags"</span><span class="jp">:</span> <span class="jp">[</span><span class="jv-s">"cliente"</span><span class="jp">,</span> <span class="jv-s">"vip"</span><span class="jp">]</span>
<span class="jp">}</span></div>
      <div class="hl"><strong>Regras rígidas:</strong> chaves sempre entre aspas duplas, sem vírgula depois do último item, sem comentários.</div>`
  },
  {
    id:'parse', time:5,
    render:()=>`
      <div class="eyebrow">Traduzindo texto e objeto · 5 minutos</div>
      <div class="slide-title">JSON.parse e JSON.stringify</div>
      <div class="slide-sub">A API sempre devolve JSON como texto — é preciso converter para objeto JavaScript.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">JavaScript · parse e stringify</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">const</span> <span class="t">texto</span> <span class="t">=</span> <span class="s">'{"nome": "Maria", "idade": 28}'</span><span class="t">;</span>
<span class="k">const</span> <span class="t">objeto</span> <span class="t">=</span> <span class="fn">JSON</span><span class="t">.</span><span class="fn">parse</span><span class="t">(</span><span class="t">texto</span><span class="t">);</span> <span class="c">// texto → objeto</span>
<span class="fn">console</span><span class="t">.</span><span class="fn">log</span><span class="t">(</span><span class="t">objeto</span><span class="t">.</span><span class="t">nome</span><span class="t">);</span> <span class="c">// "Maria"</span>

<span class="k">const</span> <span class="t">meuObjeto</span> <span class="t">=</span> <span class="t">{</span> <span class="a">nome</span>: <span class="s">"João"</span> <span class="t">};</span>
<span class="k">const</span> <span class="t">textoEnviar</span> <span class="t">=</span> <span class="fn">JSON</span><span class="t">.</span><span class="fn">stringify</span><span class="t">(</span><span class="t">meuObjeto</span><span class="t">);</span> <span class="c">// objeto → texto</span></pre>
      </div>`
  },
  {
    id:'auth', time:4,
    render:()=>`
      <div class="eyebrow">Segurança · 4 minutos</div>
      <div class="slide-title">API keys e tokens — o crachá do garçom</div>
      <div class="slide-sub">Sem crachá, o restaurante não sabe se você tem permissão para aquele pedido.</div>
      <div class="compare">
        <div class="comp-side">
          <div class="comp-hdr" style="background:#eff6ff;color:#1d4ed8">API Key</div>
          <div class="comp-body">
            Uma "senha" fixa, enviada junto com a requisição.<br><br>
            <code>Authorization: Bearer minha-chave</code>
          </div>
        </div>
        <div class="comp-side">
          <div class="comp-hdr" style="background:#fdf4ff;color:#a21caf">Token</div>
          <div class="comp-body">
            Parecido, mas geralmente TEMPORÁRIO.<br><br>
            Gerado após login, expira depois de um tempo.
          </div>
        </div>
      </div>
      <div class="hl"><strong>Nunca exponha uma API key publicamente:</strong> é como deixar o crachá caído no chão para qualquer um usar.</div>`
  },
  {
    id:'quiz', time:3,
    render:()=>`
      <div class="eyebrow">Verificação de aprendizagem · 3 minutos</div>
      <div class="slide-title">Quiz rápido — turma responde junto</div>
      <div class="slide-sub">Sem pressão. O objetivo é consolidar o que aprendemos.</div>
      <div class="quiz-block">
        <div class="quiz-q">1. Uma API tem o endpoint /produtos. Qual verbo você usaria para criar um novo produto?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>A</span>GET</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb1')"><span>B</span>POST</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>C</span>DELETE</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>D</span>PUT</div>
        </div>
        <div class="quiz-feedback" id="fb1" style="background:#f0fdf4;color:#15803d">Correto! POST é o verbo padrão para criar um novo recurso.</div>
      </div>
      <div class="quiz-block">
        <div class="quiz-q">2. Você recebeu uma resposta de API como texto e quer acessar objeto.nome. O que fazer primeiro?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>A</span>JSON.stringify(texto)</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb2')"><span>B</span>JSON.parse(texto)</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>C</span>texto.toUpperCase()</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>D</span>Nada, já funciona direto</div>
        </div>
        <div class="quiz-feedback" id="fb2" style="background:#f0fdf4;color:#15803d">Correto! JSON.parse converte o texto em objeto, permitindo acessar propriedades com ponto.</div>
      </div>`
  },
  {
    id:'fechamento', time:1,
    render:()=>`
      <div class="eyebrow">Encerramento · 1 minuto</div>
      <div class="slide-title">Recapitulando e partindo para a prática</div>
      <div class="slide-sub">O que aprendemos nesta exposição e o que fazemos agora.</div>
      <div class="reflect-list">
        <div class="reflect-item">
          <div class="reflect-num">1</div>
          <div class="reflect-text"><strong>API REST:</strong> recursos + endpoints + verbos HTTP + JSON.</div>
        </div>
        <div class="reflect-item">
          <div class="reflect-num">2</div>
          <div class="reflect-text"><strong>JSON.parse/stringify</strong> traduzem entre texto e objetos JavaScript.</div>
        </div>
        <div class="reflect-item">
          <div class="reflect-num">3</div>
          <div class="reflect-text"><strong>API keys e tokens</strong> autenticam quem está fazendo o pedido.</div>
        </div>
        <div class="reflect-item">
          <div class="reflect-num">4</div>
          <div class="reflect-text"><strong>Agora é hora de explorar.</strong> Vamos usar juntos, ao vivo, uma API pública real antes da prática individual.</div>
        </div>
      </div>
      <div class="hl"><strong>Próximas aulas:</strong> depois de explorar APIs manualmente (Postman), vamos consumi-las de verdade em JavaScript com fetch.</div>`
  }
];

let cur = 0;
let timerInterval = null;
let timerStarted = false;

function buildDots() {
  const bar = document.getElementById('dots-bar');
  SLIDES.forEach((s, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = 'Slide ' + (i + 1);
    d.onclick = () => goTo(i);
    bar.appendChild(d);
    if (i < SLIDES.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'dot-sep';
      bar.appendChild(sep);
    }
  });
}

function buildSlides() {
  const wrap = document.getElementById('slide-wrap');
  SLIDES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.id = 'sl-' + s.id;
    div.innerHTML = s.render();
    wrap.appendChild(div);
  });
}

function goTo(i) {
  const prev = cur;
  document.getElementById('sl-' + SLIDES[prev].id).classList.remove('active');
  const dots = document.querySelectorAll('.dot');
  dots[prev].classList.remove('active');
  if (i > prev) dots[prev].classList.add('done');

  cur = i;
  const el = document.getElementById('sl-' + SLIDES[cur].id);
  el.innerHTML = SLIDES[cur].render();
  el.classList.add('active');
  dots[cur].classList.add('active');
  dots[cur].classList.remove('done');

  document.getElementById('btn-prev').disabled = cur === 0;
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = cur === SLIDES.length - 1;
  btnNext.textContent = cur === SLIDES.length - 1 ? 'Finalizar' : 'Próximo →';
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + SLIDES.length;

  if (!timerStarted) { timerStarted = true; startTimer(); }
}

function nav(d) {
  const ni = cur + d;
  if (ni >= 0 && ni < SLIDES.length) goTo(ni);
}

function startTimer() {
  let rem = 30 * 60;
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    rem--;
    if (rem <= 0) { clearInterval(timerInterval); el.textContent = '00:00'; el.className = 'timer danger'; return; }
    const m = Math.floor(rem / 60), s = rem % 60;
    el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    if (rem <= 300) el.className = 'timer warn';
    if (rem <= 60)  el.className = 'timer danger';
  }, 1000);
}

function showTag(el, tag, desc) {
  document.querySelectorAll('.tag-item').forEach(t => t.classList.remove('tag-on'));
  el.classList.add('tag-on');
  document.getElementById('tag-prev').innerHTML =
    '<strong>' + tag + '</strong><br>' + desc;
}

function answer(el, type, fbId) {
  const block = el.closest('.quiz-block');
  block.querySelectorAll('.quiz-opt').forEach(o => {
    if (o === el) o.classList.add(type === 'c' ? 'correct' : 'wrong');
    else o.classList.add('dimmed');
  });
  const fb = document.getElementById(fbId);
  if (type !== 'c') {
    fb.style.background = '#fef2f2';
    fb.style.color = '#dc2626';
    fb.textContent = 'Não exatamente — pense no propósito de cada verbo/método.';
  }
  fb.style.display = 'block';
}

buildDots();
buildSlides();
document.getElementById('btn-prev').disabled = true;
</script>
