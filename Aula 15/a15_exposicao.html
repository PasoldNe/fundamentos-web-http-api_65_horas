<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="author" content="@karizeviecelli"><meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados."><title>Exposição — Aula 15 Projeto Final: Integração</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}.hdr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#0f172a;border-bottom:1px solid #1e293b;z-index:10}.hdr h1{font-size:13px;font-weight:600;color:#94a3b8}.dots{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#334155;cursor:pointer;transition:background .2s}.dot.active{background:#3b82f6}.slide-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 40px}.slide{display:none;max-width:880px;width:100%}.slide.active{display:block;animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;font-weight:600;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.slide h2{font-size:28px;font-weight:700;margin-bottom:18px;color:#f1f5f9}.slide p{font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px}.card h3{font-size:14px;color:#93c5fd;margin-bottom:6px}.card p{font-size:13px;color:#94a3b8;margin:0}.code-wrap{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;margin-top:14px;overflow-x:auto;white-space:pre}.k{color:#93C5FD}.a{color:#FDE68A}.s{color:#FDA4AF}.t{color:#E2E8F0}.c{color:#64748b;font-style:italic}.fn{color:#5EEAD4}.hl{background:#1e3a5f;border-left:3px solid #3b82f6;padding:10px 16px;border-radius:6px;font-size:13px;color:#bfdbfe;margin-top:14px}.tag-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tag{background:#1e293b;border:1px solid #334155;color:#93c5fd;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s}.tag:hover{background:#334155}.tag-desc{margin-top:10px;font-size:13px;color:#94a3b8;min-height:18px}.chk-mini{display:flex;flex-direction:column;gap:6px;margin-top:14px}.chk-mini div{font-size:13px;color:#cbd5e1;padding:6px 0;border-bottom:1px solid #1e293b}.reflect-list{list-style:none;margin-top:14px}.reflect-list li{padding:9px 0;border-bottom:1px solid #1e293b;font-size:14px;color:#cbd5e1}.reflect-list li:before{content:"→ ";color:#60a5fa;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#0f172a;border-top:1px solid #1e293b;z-index:10}.navbtn{font-size:12px;font-weight:600;color:#93c5fd;background:#1e293b;border:1px solid #334155;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}.navbtn:hover{background:#334155}.navbtn:disabled{opacity:.3;pointer-events:none}.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#60a5fa;background:#1e3a5f;border:1px solid #1e40af;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}.autoria-badge:hover{background:#1e40af}</style></head>
<body>
<div class="hdr"><h1>Aula 15 — Projeto Final: Integração</h1><div class="dots" id="dots"></div><a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></div>
<div class="slide-wrap" id="slide-wrap"></div>
<div class="nav"><button class="navbtn" id="prev" onclick="goTo(cur-1)">&#8592; Anterior</button><span style="font-size:12px;color:#64748b" id="counter"></span><button class="navbtn" id="next" onclick="goTo(cur+1)">Próximo &#8594;</button><a href="a15_demo_ao_vivo.html" class="navbtn" style="text-decoration:none;background:#1d4ed8;color:#fff;border-color:#1d4ed8">Ir para Demo &#8594;</a></div>
<script>
const SLIDES = [
{title:"A casa está pronta, hora de mobiliar por completo", eyebrow:"Analogia", body:`<p>Construímos a casa (HTML/CSS), demos um cérebro a ela (JS), ensinamos ela a se comunicar com o mundo (API/HTTP). Hoje juntamos tudo em um projeto único.</p><div class="cards"><div class="card"><h3>🏗️ Estrutura</h3><p>HTML semântico organizando cada parte da página.</p></div><div class="card"><h3>🎨 Estilo</h3><p>CSS com Flexbox/Grid e responsividade.</p></div><div class="card"><h3>🧠 Lógica</h3><p>JavaScript orquestrando tudo, com fetch e eventos.</p></div><div class="card"><h3>🌐 Dados reais</h3><p>Uma API pública alimentando o projeto de verdade.</p></div></div>`},
{title:"Planejando antes de codar", eyebrow:"Passo 1", body:`<p>Responda antes de escrever a primeira linha:</p><div class="chk-mini"><div>1. Qual é o tema/propósito do projeto?</div><div>2. Qual API pública vou consumir?</div><div>3. Quais telas/estados a interface precisa ter?</div><div>4. Como vai ser a estrutura de arquivos?</div></div><div class="hl">💡 Planejar evita retrabalho — muito mais barato ajustar no papel do que no meio do código.</div>`},
{title:"Wireframe: o rascunho da interface", eyebrow:"Passo 2", body:`<p>Um esboço simples de onde cada elemento vai ficar — não precisa ser bonito.</p><div class="code-wrap"><span class="c">┌─────────────────────────────┐\n│   Título do Projeto          │\n├─────────────────────────────┤\n│  [Campo de busca] [Buscar]   │\n├─────────────────────────────┤\n│  Card 1  │  Card 2  │ Card 3 │\n├─────────────────────────────┤\n│  (estado de erro/loading)    │\n└─────────────────────────────┘</span></div>`},
{title:"Organização de arquivos", eyebrow:"Boas práticas", body:`<p>Separe responsabilidades — nada de tudo dentro de um único HTML.</p><div class="code-wrap">meu-projeto/\n├── <span class="a">index.html</span>   <span class="c">→ estrutura</span>\n├── <span class="a">style.css</span>    <span class="c">→ estilização</span>\n├── <span class="a">script.js</span>    <span class="c">→ lógica JS</span>\n└── <span class="a">README.md</span>    <span class="c">→ (opcional)</span></div>`},
{title:"Checklist técnico do projeto", eyebrow:"O que precisa ter", body:`<p>Clique em cada item para ver o que ele significa na prática.</p><div class="tag-grid" id="tags"></div><div class="tag-desc" id="tag-desc">Clique em um item para ver a explicação.</div>`},
{title:"Hoje: desenvolvimento guiado", eyebrow:"Fechamento", body:`<ul class="reflect-list"><li>Escolha seu tema e API antes de codar.</li><li>Wireframe simples ajuda a não se perder.</li><li>Separe HTML, CSS e JS em arquivos distintos.</li><li>Próxima aula: refinamento, testes e publicação no GitHub Pages — checkpoint 5!</li></ul>`}
];
let cur=0;
function buildDots(){document.getElementById('dots').innerHTML=SLIDES.map((_,i)=>`<div class="dot" onclick="goTo(${i})" id="d${i}"></div>`).join('');}
function buildSlides(){document.getElementById('slide-wrap').innerHTML=SLIDES.map((s,i)=>`<div class="slide" id="s${i}"><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}</div>`).join('');}
function goTo(i){if(i<0||i>=SLIDES.length)return;cur=i;document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));document.getElementById(`s${i}`).classList.add('active');document.getElementById(`d${i}`).classList.add('active');document.getElementById('counter').textContent=`${i+1} / ${SLIDES.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===SLIDES.length-1;if(i===4)buildTags();}
function buildTags(){const el=document.getElementById('tags');if(!el||el.dataset.built)return;el.dataset.built='1';const tags=[['HTML semântico','header, main, section, footer organizando o conteúdo.'],['Flexbox/Grid','Layout responsivo do projeto.'],['Media queries','Adaptação para mobile.'],['fetch a API real','Ao menos 1 requisição real consumindo dados.'],['Estados de UI','Carregando / erro / sucesso tratados.'],['Interação do usuário','Busca, filtro ou botão disparando o fetch.']];el.innerHTML=tags.map(t=>`<span class="tag" onclick="showTag('${t[0]}','${t[1].replace(/'/g,"\\'")}')">${t[0]}</span>`).join('');}
function showTag(tag,desc){document.getElementById('tag-desc').textContent=`${tag}: ${desc}`;}
buildDots();buildSlides();goTo(0);
</script>
</body></html>
