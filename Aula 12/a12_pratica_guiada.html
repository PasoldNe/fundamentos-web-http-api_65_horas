<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="@karizeviecelli">
<meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados.">
<title>Prática Guiada — Aula 12 HTTP na Prática</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#1e293b;background:#f8fafc;min-height:100vh;padding:24px 24px 70px}
.wrap{max-width:820px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hdr h1{font-size:16px;font-weight:600}
.hdr p{font-size:12px;color:#94a3b8}
.prog-track{height:3px;background:#e2e8f0;border-radius:2px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:#3b82f6;border-radius:2px;transition:width .3s ease}
.acc-item{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.acc-num{width:26px;height:26px;border-radius:50%;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-num.done{background:#dcfce7;color:#16a34a}
.acc-title{font-size:13px;font-weight:600;flex:1}
.acc-chevron{font-size:11px;color:#94a3b8;transition:transform .2s}
.acc-item.open .acc-chevron{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc-item.open .acc-body{max-height:800px}
.acc-inner{padding:0 16px 16px 52px;font-size:13px;line-height:1.7;color:#475569}
.acc-inner code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:'Courier New',monospace;font-size:12px;color:#1e293b}
.code-block{background:#1e293b;color:#e2e8f0;padding:12px 14px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;line-height:1.7;margin:8px 0;overflow-x:auto;white-space:pre}
.k{color:#93C5FD}.a{color:#FDE68A}.s{color:#FDA4AF}.t{color:#E2E8F0}.c{color:#64748b;font-style:italic}
.hint-btn{font-size:11px;font-weight:600;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;padding:4px 10px;border-radius:6px;cursor:pointer;margin-top:6px;font-family:inherit}
.hint-btn:hover{background:#dbeafe}
.hint-box{display:none;margin-top:8px;padding:10px 12px;background:#fefce8;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#854d0e}
.hint-box.show{display:block}
.mark-btn{font-size:12px;font-weight:600;color:#fff;background:#16a34a;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;margin-top:10px;font-family:inherit}
.mark-btn:hover{background:#15803d}
.mark-btn.done{background:#94a3b8;pointer-events:none}
.status-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.status-chip{font-size:11px;font-weight:600;padding:6px 8px;border-radius:6px;text-align:center}
.st-200{background:#dcfce7;color:#16a34a}.st-201{background:#dcfce7;color:#16a34a}
.st-400{background:#fef3c7;color:#b45309}.st-401{background:#fef3c7;color:#b45309}.st-404{background:#fef3c7;color:#b45309}
.st-500{background:#fee2e2;color:#dc2626}
.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}
.autoria-badge:hover{background:#bfdbfe}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Prática Guiada — Aula 12</h1>
    <p>Passo a passo com apoio &nbsp;<a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></p>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div id="acc-list"></div>
</div>
<script>
const STEPS = [
  {title:"Passo 1 — Abra o DevTools e a aba Network",
   body:`Abra um site qualquer (ex.: um portal de notícias) e pressione <code>F12</code>. Clique na aba <strong>Network</strong>. Ela deve estar vazia — ainda não capturou nada.`,
   hint:"Se a lista não estiver vazia, clique no ícone 🚫 (Clear) no canto superior esquerdo da aba Network para limpar."},
  {title:"Passo 2 — Recarregue e observe a lista se preencher",
   body:`Pressione <code>F5</code> para recarregar a página com o Network já aberto. Você verá uma lista crescer: arquivos HTML, CSS, JS, imagens, e chamadas marcadas como <code>fetch</code> ou <code>xhr</code>.`,
   code:`<span class="c">// Coluna "Type" na tabela do Network:</span>\n<span class="t">document → HTML da página</span>\n<span class="t">stylesheet → arquivos CSS</span>\n<span class="t">script → arquivos JS</span>\n<span class="t">fetch/xhr → chamadas de API</span>`,
   hint:"Se a lista ficar muito longa, use o filtro de texto no topo para buscar por parte da URL."},
  {title:"Passo 3 — Filtre por Fetch/XHR",
   body:`Clique no filtro <strong>Fetch/XHR</strong> logo abaixo da aba Network. Isso esconde CSS, imagens e scripts, deixando só as chamadas de API — muito mais fácil de analisar.`,
   hint:"Se não aparecer nenhuma requisição depois de filtrar, o site pode não usar fetch/xhr nessa página — tente outra página do mesmo site."},
  {title:"Passo 4 — Inspecione uma requisição real",
   body:`Clique em uma das requisições filtradas. No painel que abre à direita, veja as abas <strong>Headers</strong>, <strong>Preview</strong> e <strong>Response</strong>. Anote: método, URL, status code, e 2 headers de resposta.`,
   code:`<span class="c">// Exemplo do que anotar:</span>\n<span class="a">Método</span>: <span class="s">GET</span>\n<span class="a">URL</span>: <span class="s">/api/usuarios</span>\n<span class="a">Status</span>: <span class="s">200 OK</span>\n<span class="a">Content-Type</span>: <span class="s">application/json</span>`,
   hint:"A aba Headers geralmente tem duas seções: 'Request Headers' (o que foi enviado) e 'Response Headers' (o que voltou)."},
  {title:"Passo 5 — Repita a requisição no Postman",
   body:`Abra o Postman (ou Thunder Client). Crie uma requisição <code>GET</code> para <code>https://jsonplaceholder.typicode.com/posts</code> e clique em Send. Compare os headers de resposta com o que você viu no site.`,
   status:true,
   hint:"No Postman, os headers de resposta ficam na aba 'Headers' do painel de resposta, geralmente ao lado de 'Body'."},
  {title:"Passo 6 — Force um erro proposital",
   body:`Mude a URL no Postman para algo que não existe, como <code>https://jsonplaceholder.typicode.com/xyz123</code>, e envie. Anote o status code retornado — provavelmente <code>404</code>.`,
   code:`<span class="c">// Requisição com endpoint inválido</span>\n<span class="k">GET</span> <span class="s">https://jsonplaceholder.typicode.com/xyz123</span>\n<span class="c">// Resposta esperada:</span>\n<span class="t">Status: 404 Not Found</span>`,
   hint:"Se o status vier 200 mesmo com URL inválida, a API pode estar redirecionando ou tratando erros de forma customizada — leia o body da resposta para confirmar."}
];
function statusGrid(){return `<div class="status-grid">${['200','201','400','401','404','500'].map(c=>`<div class="status-chip st-${c}">${c}</div>`).join('')}</div>`;}
function buildAcc(){const list=document.getElementById('acc-list');list.innerHTML=STEPS.map((s,i)=>`
  <div class="acc-item" id="acc-${i}">
    <div class="acc-head" onclick="toggle(${i})">
      <div class="acc-num" id="num-${i}">${i+1}</div>
      <div class="acc-title">${s.title}</div>
      <div class="acc-chevron">&#9656;</div>
    </div>
    <div class="acc-body">
      <div class="acc-inner">
        <p>${s.body}</p>
        ${s.code?`<div class="code-block">${s.code}</div>`:''}
        ${s.status?statusGrid():''}
        <button class="hint-btn" onclick="toggleHint(${i}, event)">💡 Dica</button>
        <div class="hint-box" id="hint-${i}">${s.hint}</div><br>
        <button class="mark-btn" id="mark-${i}" onclick="markDone(${i}, event)">Marcar como concluído</button>
      </div>
    </div>
  </div>`).join('');}
function toggle(i){const el=document.getElementById(`acc-${i}`);document.querySelectorAll('.acc-item').forEach(x=>{if(x.id!==`acc-${i}`)x.classList.remove('open');});el.classList.toggle('open');}
function toggleHint(i,e){e.stopPropagation();document.getElementById(`hint-${i}`).classList.toggle('show');}
let doneCount=0;
function markDone(i,e){e.stopPropagation();const btn=document.getElementById(`mark-${i}`);if(btn.classList.contains('done'))return;btn.classList.add('done');btn.textContent='✓ Concluído';document.getElementById(`num-${i}`).classList.add('done');document.getElementById(`num-${i}`).textContent='✓';doneCount++;document.getElementById('prog').style.width=`${Math.round((doneCount/STEPS.length)*100)}%`;if(i<STEPS.length-1){document.querySelectorAll('.acc-item').forEach(x=>x.classList.remove('open'));document.getElementById(`acc-${i+1}`).classList.add('open');}}
buildAcc();
document.getElementById('acc-0').classList.add('open');
</script>
<div style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #bfdbfe;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;z-index:9999;gap:12px">
  <a href="a12_demo_ao_vivo.html" style="display:inline-flex;align-items:center;gap:6px;background:#f8fafc;color:#64748b;font-size:12px;font-weight:600;padding:7px 15px;border-radius:8px;text-decoration:none;border:1px solid #e2e8f0">&#8592; Demo</a>
  <div style="font-size:11px;color:#94a3b8;font-family:'Courier New',monospace;text-align:center;flex:1;line-height:1.6">Aula 12 &middot; 3 de 5 &middot; Prática Guiada<br><a href="https://instagram.com/karizeviecelli" target="_blank" style="color:#2563eb;text-decoration:none;font-weight:600;font-size:10px">© @karizeviecelli</a></div>
  <a href="a12_desafio.html" style="display:inline-flex;align-items:center;gap:6px;background:#2563eb;color:#fff;font-size:12px;font-weight:600;padding:7px 15px;border-radius:8px;text-decoration:none">Desafio &#8594;</a>
</div>
</body>
</html>
