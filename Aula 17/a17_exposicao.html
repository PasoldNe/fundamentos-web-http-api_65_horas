<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="author" content="@karizeviecelli"><meta name="copyright" content="© 2026 @karizeviecelli. Todos os direitos reservados."><title>Briefing — Aula 17 Apresentação do Projeto Final</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}.hdr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#0f172a;border-bottom:1px solid #1e293b;z-index:10}.hdr h1{font-size:13px;font-weight:600;color:#94a3b8}.chkbadge{font-size:10px;font-weight:700;background:#052e1a;color:#4ade80;padding:2px 9px;border-radius:20px;margin-left:8px}.dots{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#334155;cursor:pointer;transition:background .2s}.dot.active{background:#3b82f6}.slide-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 40px}.slide{display:none;max-width:880px;width:100%}.slide.active{display:block;animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;font-weight:600;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.slide h2{font-size:28px;font-weight:700;margin-bottom:18px;color:#f1f5f9}.slide p{font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px}.card h3{font-size:14px;color:#93c5fd;margin-bottom:6px}.card p{font-size:13px;color:#94a3b8;margin:0}.code-wrap{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;margin-top:14px;overflow-x:auto;white-space:pre}.c{color:#64748b;font-style:italic}.hl{background:#1e3a5f;border-left:3px solid #3b82f6;padding:10px 16px;border-radius:6px;font-size:13px;color:#bfdbfe;margin-top:14px}.reflect-list{list-style:none;margin-top:14px}.reflect-list li{padding:9px 0;border-bottom:1px solid #1e293b;font-size:14px;color:#cbd5e1}.reflect-list li:before{content:"→ ";color:#60a5fa;font-weight:700}.timeline{margin-top:16px}.tl-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1e293b;align-items:center}.tl-num{width:24px;height:24px;border-radius:50%;background:#1e3a5f;color:#93c5fd;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}.tl-text{font-size:13px;color:#cbd5e1}.tl-time{font-size:11px;color:#64748b;margin-left:auto;flex-shrink:0}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#0f172a;border-top:1px solid #1e293b;z-index:10}.navbtn{font-size:12px;font-weight:600;color:#93c5fd;background:#1e293b;border:1px solid #334155;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}.navbtn:hover{background:#334155}.navbtn:disabled{opacity:.3;pointer-events:none}.autoria-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#60a5fa;background:#1e3a5f;border:1px solid #1e40af;padding:2px 9px;border-radius:20px;text-decoration:none;font-family:'Courier New',monospace}.autoria-badge:hover{background:#1e40af}</style></head>
<body>
<div class="hdr"><h1>Aula 17 — Apresentação do Projeto Final <span class="chkbadge">🎓 Encerramento</span></h1><div class="dots" id="dots"></div><a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a></div>
<div class="slide-wrap" id="slide-wrap"></div>
<div class="nav"><button class="navbtn" id="prev" onclick="goTo(cur-1)">&#8592; Anterior</button><span style="font-size:12px;color:#64748b" id="counter"></span><button class="navbtn" id="next" onclick="goTo(cur+1)">Próximo &#8594;</button><a href="a17_demo_ao_vivo.html" class="navbtn" style="text-decoration:none;background:#1d4ed8;color:#fff;border-color:#1d4ed8">Ver exemplo &#8594;</a></div>
<script>
const SLIDES = [
{title:"A visita guiada pela casa pronta", eyebrow:"Analogia", body:`<p>A casa foi construída, mobiliada e inaugurada. Hoje é a visita guiada: contar a história da casa, não só ler a planta em voz alta.</p><div class="cards"><div class="card"><h3>🗣️ Apresentar</h3><p>Explicar o projeto de forma clara, para quem nunca viu.</p></div><div class="card"><h3>🧭 Justificar</h3><p>Contar por que cada decisão técnica foi tomada.</p></div><div class="card"><h3>🤝 Trocar feedback</h3><p>Elogiar e sugerir, de forma específica e construtiva.</p></div><div class="card"><h3>🎓 Encerrar</h3><p>Refletir sobre a jornada desde a Aula 1.</p></div></div>`},
{title:"Roteiro da aula (1h)", eyebrow:"Como vai funcionar", body:`<div class="timeline"><div class="tl-step"><div class="tl-num">1</div><div class="tl-text">Abertura e organização da ordem de apresentações</div><div class="tl-time">5 min</div></div><div class="tl-step"><div class="tl-num">2</div><div class="tl-text">Apresentações dos projetos, uma por aluno</div><div class="tl-time">maior parte</div></div><div class="tl-step"><div class="tl-num">3</div><div class="tl-text">Perguntas e feedback rápido após cada apresentação</div><div class="tl-time">contínuo</div></div><div class="tl-step"><div class="tl-num">4</div><div class="tl-text">Encerramento e reflexão sobre a jornada</div><div class="tl-time">5 min</div></div></div>`},
{title:"Estrutura sugerida da sua fala", eyebrow:"2-4 minutos", body:`<div class="code-wrap">1. O que é o projeto? (tema, para quem serve)      <span class="c">— 30s</span>\n2. Demonstração ao vivo funcionando                <span class="c">— 60-90s</span>\n3. Uma decisão técnica e por quê                   <span class="c">— 30s</span>\n4. Um desafio enfrentado e como resolveu           <span class="c">— 30s</span>\n5. Link do projeto publicado                       <span class="c">— 10s</span></div><div class="hl">💡 Não é sobre ler o código linha a linha — é sobre contar a história das suas decisões.</div>`},
{title:"O que observar como plateia", eyebrow:"Enquanto assiste aos colegas", body:`<ul class="reflect-list"><li>A interface está clara? Dá para entender o propósito rapidamente?</li><li>A demonstração ao vivo funcionou sem erros visíveis?</li><li>A explicação técnica fez sentido, mesmo sem ver o código?</li><li>Que elogio específico você daria?</li><li>Que sugestão específica você daria?</li></ul>`},
{title:"Fim de uma jornada, início de outra", eyebrow:"Encerramento do curso", body:`<p>Da Aula 1 (o que é a internet, o garçom e o restaurante) até aqui: HTML, CSS, JavaScript, APIs, Git, publicação. Você construiu, testou e publicou algo seu, do zero.</p><div class="hl">🎓 Parabéns por chegar até aqui. Este é só o começo — continue construindo.</div>`}
];
let cur=0;
function buildDots(){document.getElementById('dots').innerHTML=SLIDES.map((_,i)=>`<div class="dot" onclick="goTo(${i})" id="d${i}"></div>`).join('');}
function buildSlides(){document.getElementById('slide-wrap').innerHTML=SLIDES.map((s,i)=>`<div class="slide" id="s${i}"><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}</div>`).join('');}
function goTo(i){if(i<0||i>=SLIDES.length)return;cur=i;document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));document.getElementById(`s${i}`).classList.add('active');document.getElementById(`d${i}`).classList.add('active');document.getElementById('counter').textContent=`${i+1} / ${SLIDES.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===SLIDES.length-1;}
buildDots();buildSlides();goTo(0);
</script>
</body></html>
